// ─── Matrix rain background (preserved from v2.3) ────────────────
const MatrixRain = () => {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let animId;
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener("resize", resize);
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF:.";
    const draw = () => {
      ctx.fillStyle = "rgba(0,0,0,0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${fontSize}px monospace`;
      columns = Math.floor(canvas.width / fontSize);
      while (drops.length < columns) drops.push(1);
      for (let i = 0; i < columns; i++) {
        const ch = chars[Math.floor(Math.random() * chars.length)];
        const b = Math.random();
        if (b > 0.95) ctx.fillStyle = "#ffffff";
        else if (b > 0.85) ctx.fillStyle = "#39ff14";
        else ctx.fillStyle = `rgba(0, ${100 + Math.floor(Math.random()*155)}, 0, ${0.25 + Math.random()*0.4})`;
        ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      animId = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(animId); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", inset: 0, zIndex: 0, opacity: 0.10, pointerEvents: "none" }} />;
};

<!-- Live-data hydration · reads hermes-status.json (written hourly by hermes-status-writer Call).
     Failed fetch leaves static fallback values in place — dashboard stays usable offline. -->
<script>
window.__hydrate = function hydrateLive() {
(function () {
  function update(key, val) {
    document.querySelectorAll('[data-live="' + key + '"]').forEach(el => {
      if (val === null || val === undefined || val === '') return;
      if (key === 'subagents_html') {
        el.innerHTML = String(val);
      } else {
        el.textContent = String(val);
      }
    });
  }
  const sources = [
    './hermes-status.json',
    'https://extracoffee13.github.io/hartley-command/hermes-status.json'
  ];
  // Harvard Corpus hydration — separate JSON
  (async () => {
    try {
      const r = await fetch('./harvard-corpus-stats.json?nocache=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) {
        const r2 = await fetch('https://extracoffee13.github.io/hartley-command/harvard-corpus-stats.json?nocache=' + Date.now(), { cache: 'no-store' });
        if (!r2.ok) return;
        const hc = await r2.json();
        update('hc_total', hc.total_articles);
        update('hc_faculty', hc.faculty_indexed);
        update('hc_topics', hc.topics_covered);
        update('hc_faclinks', (hc.total_faculty_links || 0).toLocaleString());
        update('hc_topiclinks', (hc.total_topic_links || 0).toLocaleString());
        update('hc_hbswk', hc.by_source && hc.by_source.hbswk);
        update('hc_hbsai', hc.by_source && hc.by_source['hbs-ai-institute']);
        update('hc_d3_total', hc.by_source && hc.by_source.d3);
        return;
      }
      const hc = await r.json();
      update('hc_total', hc.total_articles);
      update('hc_faculty', hc.faculty_indexed);
      update('hc_topics', hc.topics_covered);
      update('hc_faclinks', (hc.total_faculty_links || 0).toLocaleString());
      update('hc_topiclinks', (hc.total_topic_links || 0).toLocaleString());
      update('hc_hbswk', hc.by_source && hc.by_source.hbswk);
      update('hc_hbsai', hc.by_source && hc.by_source['hbs-ai-institute']);
      update('hc_d3_total', hc.by_source && hc.by_source.d3);
      update('hc_hbr', hc.by_source && hc.by_source.hbr);
      update('hc_sana', hc.by_source && hc.by_source.sana);
    } catch (e) { /* fallback to static */ }
  })();


  // Skills registry (Hermes + Atlas) — counts only
  (async () => {
    try {
      const r = await fetch('./installed-skills-registry.json?cb=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return; const reg = await r.json(); const c = reg._counts || {};
      update('skills_registry_total', c.total || (reg.skills || []).length);
      update('skills_registry_split', (c.hermes_skills ?? '?') + ' Hermes · ' + (c.atlas_skills ?? '?') + ' Atlas');
      update('skills_registry_ts', (reg.updated_at || '').slice(0, 10));
    } catch (_) {}
  })();

  (async () => {
    for (const url of sources) {
      try {
        const res = await fetch(url + '?nocache=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) continue;
        const d = await res.json();
        ['heartbeat_ts', 'lens_week', 'memory_files'].forEach(k => {
          let v = d[k]; if (k === 'heartbeat_ts' && v) v = new Date(v).toLocaleString();
          update(k, v);
        });
        return;
      } catch (e) { /* try next source */ }
    }
  })();
})();
};
</script>

<script>
/* ===== CONSTRUCT LIVE-UPDATES + PER-FEED FRESHNESS (2026-06-18) =====
   Ends the recurring "dashboard reads the same as yesterday" problem: every feed
   shows its own timestamp + a red STALE badge when old, so missing/old data is
   VISIBLE and attributable — never silently reassuring. Runs outside React. */
(function(){
  var O=document.getElementById('construct-updates-overlay'); if(!O) return;
  var MUT='#8a94a6',RED='#f87171',GRN='#4ade80',AMB='#fbbf24',CY='#00d4ff';
  function ageH(ts){ if(!ts) return null; var t=new Date(ts); if(isNaN(t)) return null; return (Date.now()-t)/36e5; }
  function badge(ts,maxH){ var a=ageH(ts); if(a==null) return '<span style="color:'+RED+'">⚠ no timestamp</span>';
    var lbl=a<1?Math.round(a*60)+'m':(a<48?a.toFixed(1)+'h':Math.round(a/24)+'d')+' ago';
    var stale=a>maxH; return '<span style="color:'+(stale?RED:GRN)+'">'+(stale?'⚠ STALE ':'● ')+lbl+'</span>'; }
  function gj(u){ return fetch(u+'?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}); }

  function render(corpus,scout,eco,hs){
    var rows=[];
    rows.push(['Ecosystem feed', eco?((eco.hermes&&eco.hermes.cron?eco.hermes.cron.enabled+' Hermes jobs':'')):'—', eco&&eco.generated, 2]);
    rows.push(['Hermes heartbeat', hs?'Hermes status':'—', hs&&hs.heartbeat_ts, 3]);
    rows.push(['Harvard corpus', corpus?(corpus.total_articles+' articles'):'—', corpus&&corpus.last_indexed, 30]);
    var sc = scout&&(scout.queue||scout.candidates); var scn = Array.isArray(sc)?sc.length:0;
    rows.push(['Capability scout', scout?(scn+' candidates waiting'):'—', scout&&(scout.updated_at||scout.generated), 30]);
    var anyStale=rows.some(function(r){var a=ageH(r[2]); return a==null||a>r[3];});
    var html='<div style="background:#0f1217;border:1px solid '+(anyStale?RED:GRN)+';border-radius:10px;padding:12px 14px;">'+
      '<div style="font-size:12px;font-weight:700;letter-spacing:.04em;color:'+(anyStale?RED:GRN)+';margin-bottom:8px;">'+
        (anyStale?'⚠ CONSTRUCT — some feeds are late (see flags)':'● CONSTRUCT — every feed updated on schedule')+
        '<span style="float:right;color:'+MUT+';font-weight:400;">live · refreshes 60s · '+new Date().toLocaleTimeString()+'</span></div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;">';
    rows.forEach(function(r){ html+='<div style="background:#151a21;border:1px solid #1f2630;border-radius:8px;padding:8px 10px;">'+
      '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:'+MUT+'">'+r[0]+'</div>'+
      '<div style="font-size:13px;color:#e6e9ef;margin:2px 0;font-family:ui-monospace,Menlo,monospace;">'+r[1]+'</div>'+
      '<div style="font-size:11px;font-family:ui-monospace,Menlo,monospace;">'+badge(r[2],r[3])+'</div>'+
      (r[4]||'')+'</div>'; });
    html+='</div>';
    // Scout top picks
    if(scn){ var top=(Array.isArray(sc)?sc:[]).slice(0,3); html+='<div style="margin-top:8px;font-size:11px;color:'+CY+'">Scout top: '+
      top.map(function(c){return (c.name||c.title||'?')+(c.action&&/APPROVAL/i.test(c.action)?' ⚑needs approval':'');}).join(' · ')+'</div>'; }
    html+='</div>';
    O.innerHTML=html;
  }
  function load(){
    Promise.all([ gj('./harvard-corpus-stats.json'), gj('./capability-scout-queue.json'),
      gj('./ecosystem-status.json'), gj('./hermes-status.json')
    ]).then(function(a){ render(a[0],a[1],a[2],a[3]); });
  }
  load(); setInterval(load,60000);
})();
</script>
