<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THE CONSTRUCT v2.3 — Brand 9 / Hartley Capital Agent Ecosystem</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow-x: hidden; font-family: 'Courier New', Courier, monospace; }
  
  @keyframes nlrain { 0% { transform: translateY(0); } 100% { transform: translateY(140%); } }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes nlsweep { 0% { transform: translateY(0); opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { transform: translateY(540px); opacity: 0; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.97; } 51% { opacity: 0.9; } 52% { opacity: 1; } }
  @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 8px rgba(57,255,20,0.3); } 50% { box-shadow: 0 0 18px rgba(57,255,20,0.55); } }
  @keyframes scan-line { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
  * { scrollbar-width: thin; scrollbar-color: rgba(57,255,20,0.3) transparent; }
  *::-webkit-scrollbar { width: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(57,255,20,0.3); border-radius: 2px; }
  input::placeholder, textarea::placeholder { color: rgba(57,255,20,0.25) !important; }
  select option { background: #000; color: #39ff14; }
  a { color: #00d4ff; text-decoration: none; }
  a:hover { color: #39ff14; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ═══════════════════════════════════════════════════════════════
// THE CONSTRUCT v2.3 — Brand 9 / Hartley Capital Agent Ecosystem
// Locked 2026-04-24 baseline · Louis added 2026-04-27
// Day-90 kill criterion: 2026-07-23
// Cool-palette enforced (no warm colors per B9 brand canonical)
// ═══════════════════════════════════════════════════════════════

let _id = 100;
const uid = () => `agent-${++_id}-${Date.now().toString(36)}`;
const hexToRgb = (hex) => {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `${r},${g},${b}`;
};

// Day countdown helpers
const PLAN_LOCK_DATE = new Date("2026-04-24T00:00:00");
const KILL_CRITERION_DATE = new Date("2026-07-23T00:00:00");
const daysBetween = (a, b) => Math.floor((b - a) / (1000 * 60 * 60 * 24));
const dayOfNinety = () => Math.max(0, daysBetween(PLAN_LOCK_DATE, new Date()) + 1);
const daysUntilKill = () => Math.max(0, daysBetween(new Date(), KILL_CRITERION_DATE));

// ── Matrix Digital Rain Canvas ──
const MatrixRain = () => {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let animId;
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener("resize", resize);
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF:.";
    const draw = () => {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${fontSize}px monospace`;
      columns = Math.floor(canvas.width / fontSize);
      while (drops.length < columns) drops.push(1);
      for (let i = 0; i < columns; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        const brightness = Math.random();
        if (brightness > 0.95) ctx.fillStyle = "#ffffff";
        else if (brightness > 0.8) ctx.fillStyle = "#39ff14";
        else ctx.fillStyle = `rgba(0, ${100 + Math.floor(Math.random() * 155)}, 0, ${0.3 + Math.random() * 0.5})`;
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      animId = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(animId); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", top: 0, left: 0, width: "100%", height: "100%", zIndex: 0, opacity: 0.13 }} />;
};

// ── Glitch text effect ──
const GlitchText = ({ text, tag: Tag = "span", style = {} }) => {
  const [glitch, setGlitch] = useState(false);
  useEffect(() => {
    const interval = setInterval(() => {
      setGlitch(true);
      setTimeout(() => setGlitch(false), 150);
    }, 3000 + Math.random() * 5000);
    return () => clearInterval(interval);
  }, []);
  return (
    <Tag style={{ ...style, position: "relative", display: "inline-block" }}>
      {text}
      {glitch && (
        <>
          <Tag style={{ ...style, position: "absolute", left: "2px", top: "-1px", color: "#c500ff", clipPath: "inset(20% 0 40% 0)", opacity: 0.8 }}>{text}</Tag>
          <Tag style={{ ...style, position: "absolute", left: "-2px", top: "1px", color: "#00ffff", clipPath: "inset(50% 0 10% 0)", opacity: 0.8 }}>{text}</Tag>
        </>
      )}
    </Tag>
  );
};

// ── Scanning line animation ──
const ScanLine = () => {
  const [pos, setPos] = useState(0);
  useEffect(() => {
    const interval = setInterval(() => setPos(p => (p + 1) % 100), 30);
    return () => clearInterval(interval);
  }, []);
  return <div style={{ position: "absolute", top: `${pos}%`, left: 0, right: 0, height: "2px", background: "linear-gradient(90deg, transparent, rgba(57,255,20,0.3), transparent)", zIndex: 1, pointerEvents: "none" }} />;
};

// ── Pulse Ring (for agent avatars) ──
const PulseRing = ({ color = "#39ff14", size = 80 }) => (
  <div style={{ position: "absolute", width: size, height: size, borderRadius: "50%", border: `1px solid ${color}`, animation: "pulse-ring 2s ease-out infinite", opacity: 0 }} />
);

// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// NEUROLINK 2099 — 1999 Matrix grammar, 2099 holographic execution.
// Multi-layer composite: matrix rain bg → hex grid → bezier sigil web →
// synaptic particle streams → concentric orbital nodes → holographic Bobby
// core → corner HUD frames + live ticker + scanning sweep.
// Spec from Bobby 2026-04-28.
// ═══════════════════════════════════════════════════════════════
const NEUROLINK_FUNCTION_COLOR = {
  Strategy:        "#00d4ff",
  "Hartley Capital": "#4a9eff",
  Technology:      "#4a9eff",
  Finance:         "#4a9eff",
  Operations:      "#39ff14",
  Creative:        "#b388ff",
  Meta:            "#ffffff",
  Infrastructure:  "#ffffff",
  People:          "#39ff14",
  Executive:       "#4a9eff",
  Revenue:         "#00ffaa",
  Product:         "#a78bfa",
};

const neurolinkColorFor = (agent) => {
  if (agent.isHuman) return "#ffd700";
  if (agent.codename === "Self-Improving Loop" || agent.codename === "Cornerstone") return "#ffffff";
  return NEUROLINK_FUNCTION_COLOR[agent.department] || "#39ff14";
};

// Matrix-rain layer — falling glyph columns behind everything.
const NeurolinkMatrixRain = () => {
  const cols = 60;
  const glyphs = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン░▒▓★◆◇◈⟁⟁⟢⟣⌬𓂀";
  const columns = useMemo(() => Array.from({ length: cols }).map((_, i) => ({
    left: (i / cols) * 100,
    delay: -((i * 137) % 1000) / 100,
    dur: 6 + ((i * 53) % 700) / 100,
    chars: Array.from({ length: 14 }).map(() => glyphs[Math.floor(Math.random() * glyphs.length)]).join("\n"),
    opacity: 0.06 + (i % 7) * 0.025,
  })), []);
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", opacity: 0.85 }}>
      {columns.map((c, i) => (
        <div key={i} style={{
          position: "absolute", left: `${c.left}%`, top: "-30%",
          fontFamily: "'Courier New', monospace", fontSize: 11, lineHeight: "14px", letterSpacing: 1,
          color: "#39ff14", opacity: c.opacity, textShadow: "0 0 6px #39ff14",
          whiteSpace: "pre", animation: `nlrain ${c.dur}s linear ${c.delay}s infinite`,
        }}>{c.chars}</div>
      ))}
    </div>
  );
};

const NeurolinkVisualization = ({ agents }) => {
  const [hovered, setHovered] = useState(null);
  const [packets, setPackets] = useState(0);
  const [stamp, setStamp] = useState("00:00:00.000");

  useEffect(() => {
    const id = setInterval(() => {
      const d = new Date();
      setStamp(d.toLocaleTimeString("en-US", { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0"));
      setPackets(p => p + Math.floor(7 + Math.random() * 18));
    }, 80);
    return () => clearInterval(id);
  }, []);

  const W = 1600, H = 780;
  const cx = W / 2, cy = H / 2;
  const bobby = agents.find(a => a.isHuman) || agents[0];
  const others = agents.filter(a => !a.isHuman);
  const N = others.length;

  // Two concentric ellipses for visual depth — scaled with the taller H
  const outerN = Math.ceil(N * 0.62);
  const innerN = N - outerN;
  const outer = { rx: 640, ry: 310 };
  const inner = { rx: 360, ry: 170 };

  // ── PRAXIS layer: spontaneous firing + explicit synapse fires ──
  // Spontaneous = autonomous neural activity (a node fires on its own).
  // Synapse fire = explicit Bobby↔node burst with impact flash at receiver.
  // Both modeled as ephemeral React state, auto-cleaned after animation.
  const [spontaneous, setSpontaneous] = useState([]);
  const [synapseFires, setSynapseFires] = useState([]);
  useEffect(() => {
    if (others.length === 0) return;
    const tickSpontaneous = () => {
      const idx = Math.floor(Math.random() * others.length);
      const id = Math.random().toString(36).slice(2);
      setSpontaneous(s => [...s, { idx, id }]);
      setTimeout(() => setSpontaneous(s => s.filter(x => x.id !== id)), 1500);
    };
    const tickSynapse = () => {
      const idx = Math.floor(Math.random() * others.length);
      const id = Math.random().toString(36).slice(2);
      setSynapseFires(s => [...s, { idx, id }]);
      setTimeout(() => setSynapseFires(s => s.filter(x => x.id !== id)), 1300);
    };
    const a = setInterval(tickSpontaneous, 400);
    const b = setInterval(tickSynapse, 950);
    return () => { clearInterval(a); clearInterval(b); };
  }, [others.length]);

  const positioned = others.map((a, i) => {
    const isOuter = i % 2 === 0 ? (i / 2 < outerN) : false;
    const inOuter = i < outerN;
    const r = inOuter ? outer : inner;
    const idx = inOuter ? i : i - outerN;
    const total = inOuter ? outerN : innerN;
    const angle = (idx / total) * Math.PI * 2 - Math.PI / 2 + (inOuter ? 0 : Math.PI / total);
    return {
      agent: a,
      x: cx + Math.cos(angle) * r.rx,
      y: cy + Math.sin(angle) * r.ry,
      color: neurolinkColorFor(a),
      outer: inOuter,
      delay: i * 0.07,
      i,
    };
  });

  // Bezier control point for organic curves — pull toward orbit perpendicular
  const bezierPath = (p) => {
    const mx = (cx + p.x) / 2;
    const my = (cy + p.y) / 2;
    const dx = p.x - cx, dy = p.y - cy;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const offset = 35 + (p.i % 5) * 6;
    const px = mx + (-dy / len) * offset * (p.i % 2 ? 1 : -1);
    const py = my + (dx / len) * offset * (p.i % 2 ? 1 : -1);
    return `M${cx},${cy} Q${px},${py} ${p.x},${p.y}`;
  };

  return (
    <div style={{
      position: "relative", width: "100%", height: H,
      background: "radial-gradient(ellipse at center, #001a14 0%, #000208 70%, #000000 100%)",
      borderBottom: "1px solid rgba(0,212,255,0.25)",
      overflow: "hidden",
    }}>
      <NeurolinkMatrixRain />

      {/* Hex grid mid-layer */}
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid slice"
           style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0.18, pointerEvents: "none" }}>
        <defs>
          <pattern id="hexgrid" x="0" y="0" width="56" height="48.5" patternUnits="userSpaceOnUse">
            <polygon points="14,0 42,0 56,24.25 42,48.5 14,48.5 0,24.25" fill="none" stroke="#0c5d4a" strokeWidth="0.4" />
          </pattern>
        </defs>
        <rect width={W} height={H} fill="url(#hexgrid)" />
      </svg>

      {/* Sweeping scan line */}
      <div style={{
        position: "absolute", left: 0, right: 0, top: 0, height: 2,
        background: "linear-gradient(90deg, transparent 0%, rgba(57,255,20,0.4) 30%, rgba(0,212,255,0.5) 50%, rgba(57,255,20,0.4) 70%, transparent 100%)",
        animation: "nlsweep 8s linear infinite", boxShadow: "0 0 12px #39ff14", pointerEvents: "none",
      }} />

      {/* Main SVG: connections, particles, nodes */}
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet"
           style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }}>
        <defs>
          <radialGradient id="nlBobbyCore">
            <stop offset="0%"  stopColor="#fff8d4" stopOpacity="1" />
            <stop offset="35%" stopColor="#ffd700" stopOpacity="1" />
            <stop offset="70%" stopColor="#ff9d00" stopOpacity="0.4" />
            <stop offset="100%" stopColor="#ffd700" stopOpacity="0" />
          </radialGradient>
          <filter id="nlSoftGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="2.5" result="b" />
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="nlHardGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="6" result="b" />
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          {positioned.map((p, i) => (
            <linearGradient key={`grad${i}`} id={`nlSyn${i}`} x1={cx} y1={cy} x2={p.x} y2={p.y} gradientUnits="userSpaceOnUse">
              <stop offset="0%" stopColor="#ffd700" stopOpacity="0.85" />
              <stop offset="35%" stopColor={p.color} stopOpacity="0.55" />
              <stop offset="100%" stopColor={p.color} stopOpacity="0.18" />
            </linearGradient>
          ))}
        </defs>

        {/* Orbit guide ellipses (subtle) */}
        <ellipse cx={cx} cy={cy} rx={outer.rx} ry={outer.ry} fill="none" stroke="rgba(0,212,255,0.08)" strokeWidth="0.6" strokeDasharray="2 6" />
        <ellipse cx={cx} cy={cy} rx={inner.rx} ry={inner.ry} fill="none" stroke="rgba(57,255,20,0.10)" strokeWidth="0.6" strokeDasharray="2 6" />

        {/* Bezier connection web — Bobby to every node */}
        {positioned.map((p, i) => (
          <path key={`L${i}`} d={bezierPath(p)} fill="none" stroke={`url(#nlSyn${i})`} strokeWidth="0.9"
                opacity={hovered && hovered.codename !== p.agent.codename && hovered.codename !== bobby.codename ? 0.18 : 0.7} />
        ))}

        {/* Synaptic particles — multiple per connection, staggered */}
        {positioned.flatMap((p, i) => {
          const dur = 2.2 + (i % 7) * 0.35;
          return [0, 0.3, 0.65].map((delayFrac, j) => (
            <circle key={`P${i}-${j}`} r={2 + (j === 0 ? 0.6 : 0)} fill={p.color} filter="url(#nlSoftGlow)" opacity="0">
              <animateMotion dur={`${dur}s`} repeatCount="indefinite" begin={`${-delayFrac * dur}s`} path={bezierPath(p)} />
              <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur={`${dur}s`} repeatCount="indefinite" begin={`${-delayFrac * dur}s`} />
            </circle>
          ));
        })}

        {/* Lateral agent-to-agent flickers — every 4th adjacent pair sends a packet */}
        {positioned.filter((_, i) => i % 4 === 0).map((p, k) => {
          const next = positioned[(positioned.indexOf(p) + 3) % positioned.length];
          const dur = 4.5 + (k % 3) * 0.9;
          return (
            <circle key={`X${k}`} r="1.6" fill={p.color} opacity="0">
              <animateMotion dur={`${dur}s`} repeatCount="indefinite" path={`M${p.x},${p.y} Q${cx},${cy + 80} ${next.x},${next.y}`} />
              <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.2;0.8;1" dur={`${dur}s`} repeatCount="indefinite" />
            </circle>
          );
        })}

        {/* Bobby concentric breathing rings */}
        {[0, 0.5, 1.0, 1.5, 2.0].map((delay, i) => (
          <circle key={`pr${i}`} cx={cx} cy={cy} r="22" fill="none" stroke="#ffd700" strokeWidth="1.2" opacity="0">
            <animate attributeName="r" values="22;90;90" keyTimes="0;0.85;1" dur="2.5s" repeatCount="indefinite" begin={`${delay}s`} />
            <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.85;1" dur="2.5s" repeatCount="indefinite" begin={`${delay}s`} />
            <animate attributeName="stroke-width" values="1.6;0.3;0.3" keyTimes="0;0.85;1" dur="2.5s" repeatCount="indefinite" begin={`${delay}s`} />
          </circle>
        ))}

        {/* Hexagon halo around Bobby */}
        <polygon points={
          [0,1,2,3,4,5].map(k => {
            const a = (k / 6) * Math.PI * 2 - Math.PI / 2;
            return `${cx + Math.cos(a) * 36},${cy + Math.sin(a) * 36}`;
          }).join(" ")
        } fill="none" stroke="#ffd700" strokeWidth="1.2" opacity="0.6" filter="url(#nlSoftGlow)">
          <animateTransform attributeName="transform" type="rotate" from={`0 ${cx} ${cy}`} to={`360 ${cx} ${cy}`} dur="40s" repeatCount="indefinite" />
        </polygon>

        {/* Bobby gold glow halo */}
        <circle cx={cx} cy={cy} r="58" fill="url(#nlBobbyCore)" />

        {/* Bobby center node */}
        <circle cx={cx} cy={cy} r="20" fill="#ffd700" filter="url(#nlHardGlow)"
                onMouseEnter={() => setHovered(bobby)} onMouseLeave={() => setHovered(null)} style={{ cursor: "pointer" }}>
          <animate attributeName="r" values="20;22;20" dur="2.5s" repeatCount="indefinite" />
        </circle>
        <text x={cx} y={cy + 6} textAnchor="middle" fontFamily="'Courier New', monospace" fontSize="18" fontWeight="bold" fill="#000" pointerEvents="none">B</text>
        <text x={cx} y={cy + 56} textAnchor="middle" fontFamily="'Courier New', monospace" fontSize="11" fill="#ffd700" letterSpacing="3" opacity="0.9" pointerEvents="none">BOBBY · FOUNDER</text>

        {/* Agent nodes */}
        {positioned.map((p, i) => {
          const isHover = hovered && hovered.codename === p.agent.codename;
          const r = isHover ? 11 : 8;
          return (
            <g key={`N${i}`} onMouseEnter={() => setHovered(p.agent)} onMouseLeave={() => setHovered(null)} style={{ cursor: "pointer" }}>
              {/* Outer ring */}
              <circle cx={p.x} cy={p.y} r={r + 6} fill="none" stroke={p.color} strokeWidth="0.8" opacity={isHover ? 0.9 : 0.35}>
                <animateTransform attributeName="transform" type="rotate" from={`0 ${p.x} ${p.y}`} to={`360 ${p.x} ${p.y}`} dur={`${30 + i}s`} repeatCount="indefinite" />
              </circle>
              {/* Glow */}
              <circle cx={p.x} cy={p.y} r={r + 12} fill={p.color} opacity="0.08" filter="url(#nlSoftGlow)" />
              {/* Core */}
              <circle cx={p.x} cy={p.y} r={r} fill={p.color} filter="url(#nlSoftGlow)"
                      opacity={hovered && !isHover ? 0.42 : 1}>
                <animate attributeName="r" values={`${r-1};${r+0.8};${r-1}`} dur={`${2.2 + (i % 4) * 0.35}s`} repeatCount="indefinite" begin={`${(i * 0.12) % 2}s`} />
              </circle>
              {/* Label */}
              <text x={p.x} y={p.y - r - 7} textAnchor="middle" fontFamily="'Courier New', monospace"
                    fontSize="10" fill={p.color} opacity={hovered && !isHover ? 0.45 : 0.95} letterSpacing="1" pointerEvents="none">
                {p.agent.codename.length > 14 ? p.agent.codename.substring(0, 13) + "…" : p.agent.codename}
              </text>
              {p.agent.score != null && (
                <text x={p.x} y={p.y + r + 14} textAnchor="middle" fontFamily="'Courier New', monospace"
                      fontSize="8" fill={p.color} opacity={hovered && !isHover ? 0.35 : 0.7} letterSpacing="1" pointerEvents="none">
                  {p.agent.score}/25
                </text>
              )}
            </g>
          );
        })}

        {/* SPONTANEOUS FIRING — autonomous neural activity, random nodes burst on their own */}
        {spontaneous.map(s => {
          const p = positioned[s.idx];
          if (!p) return null;
          return (
            <g key={`SF${s.id}`}>
              {/* Outer expanding shockwave */}
              <circle cx={p.x} cy={p.y} r="8" fill="none" stroke={p.color} strokeWidth="2" opacity="0">
                <animate attributeName="r" values="8;52;52" keyTimes="0;0.85;1" dur="1.5s" repeatCount="1" />
                <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.18;1" dur="1.5s" repeatCount="1" />
                <animate attributeName="stroke-width" values="2.5;0.4;0.4" keyTimes="0;0.85;1" dur="1.5s" repeatCount="1" />
              </circle>
              {/* Inner bright core flash */}
              <circle cx={p.x} cy={p.y} r="3" fill="#ffffff" filter="url(#nlHardGlow)" opacity="0">
                <animate attributeName="r" values="3;14;0" keyTimes="0;0.25;1" dur="1.5s" repeatCount="1" />
                <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.18;1" dur="1.5s" repeatCount="1" />
              </circle>
              {/* Color bloom */}
              <circle cx={p.x} cy={p.y} r="2" fill={p.color} filter="url(#nlSoftGlow)" opacity="0">
                <animate attributeName="r" values="2;26;26" keyTimes="0;0.55;1" dur="1.5s" repeatCount="1" />
                <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.25;1" dur="1.5s" repeatCount="1" />
              </circle>
            </g>
          );
        })}

        {/* SYNAPSE FIRES — bright Bobby↔node bursts with impact flash at receiver */}
        {synapseFires.map(s => {
          const p = positioned[s.idx];
          if (!p) return null;
          const path = bezierPath(p);
          return (
            <g key={`SY${s.id}`}>
              {/* Trailing wake — thicker translucent streak */}
              <circle r="9" fill={p.color} opacity="0" filter="url(#nlSoftGlow)">
                <animateMotion dur="0.65s" repeatCount="1" path={path} />
                <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.15;0.85;1" dur="0.65s" repeatCount="1" />
                <animate attributeName="r" values="6;10;12" keyTimes="0;0.5;1" dur="0.65s" repeatCount="1" />
              </circle>
              {/* Bright pulse — leading edge, white-hot */}
              <circle r="4" fill="#ffffff" opacity="0" filter="url(#nlHardGlow)">
                <animateMotion dur="0.65s" repeatCount="1" path={path} />
                <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="0.65s" repeatCount="1" />
                <animate attributeName="r" values="3;5;6" keyTimes="0;0.5;1" dur="0.65s" repeatCount="1" />
              </circle>
              {/* Impact flash at receiver — fires after pulse arrives */}
              <circle cx={p.x} cy={p.y} r="0" fill={p.color} filter="url(#nlHardGlow)" opacity="0">
                <animate attributeName="r" values="0;0;36;36" keyTimes="0;0.5;0.78;1" dur="1.3s" repeatCount="1" />
                <animate attributeName="opacity" values="0;0;0.95;0" keyTimes="0;0.5;0.6;1" dur="1.3s" repeatCount="1" />
              </circle>
              {/* Impact ring */}
              <circle cx={p.x} cy={p.y} r="0" fill="none" stroke="#ffffff" strokeWidth="2" opacity="0">
                <animate attributeName="r" values="0;0;46;46" keyTimes="0;0.5;0.95;1" dur="1.3s" repeatCount="1" />
                <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.5;0.55;1" dur="1.3s" repeatCount="1" />
                <animate attributeName="stroke-width" values="0;0;2.5;0.3" keyTimes="0;0.5;0.55;1" dur="1.3s" repeatCount="1" />
              </circle>
            </g>
          );
        })}
      </svg>

      {/* HUD — top-left identifier */}
      <div style={{ position: "absolute", top: 12, left: 18, fontFamily: "'Courier New', monospace", color: "#39ff14", fontSize: 10, letterSpacing: 3, zIndex: 5, pointerEvents: "none" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ width: 8, height: 8, borderRadius: "50%", background: "#39ff14", boxShadow: "0 0 8px #39ff14", animation: "blink 1.6s infinite" }} />

          <span style={{ color: "#00d4ff" }}>CONSTRUCT/CORE</span>
          <span style={{ opacity: 0.3 }}>//</span>
          <span style={{ color: "#ffd700" }}>PRAXIS-LINKED</span>

          AUTHENTICATED · {agents.length} NODES SYNCED · SYNAPSE LIVE · SPONTANEOUS FIRING ON
        </div>
      </div>

      {/* HUD — top-right live ticker */}
      <div style={{ position: "absolute", top: 12, right: 18, fontFamily: "'Courier New', monospace", fontSize: 10, letterSpacing: 2, zIndex: 5, pointerEvents: "none", textAlign: "right" }}>
        <div style={{ color: "#39ff14", marginBottom: 3 }}>{stamp}</div>
        <div style={{ color: "rgba(0,212,255,0.85)", fontSize: 9, letterSpacing: 2 }}>
          PACKETS <span style={{ color: "#00d4ff", fontWeight: "bold" }}>{packets.toLocaleString()}</span>
          <span style={{ margin: "0 6px", opacity: 0.4 }}>·</span>
          NODES <span style={{ color: "#39ff14", fontWeight: "bold" }}>{agents.length}</span>
          <span style={{ margin: "0 6px", opacity: 0.4 }}>·</span>
          SYNC <span style={{ color: "#39ff14" }}>100%</span>
        </div>
        <div style={{ marginTop: 4, color: "rgba(255,215,0,0.7)", fontSize: 9, letterSpacing: 2 }}>
          ◇ LIVE SYNAPTIC NETWORK ◇
        </div>
      </div>

      {/* Corner frame brackets — HUD aesthetic */}
      {[
        { top: 8, left: 8, borders: "borderTop borderLeft" },
        { top: 8, right: 8, borders: "borderTop borderRight" },
        { bottom: 8, left: 8, borders: "borderBottom borderLeft" },
        { bottom: 8, right: 8, borders: "borderBottom borderRight" },
      ].map((c, i) => (
        <div key={i} style={{
          position: "absolute", width: 22, height: 22, pointerEvents: "none", zIndex: 4,
          ...(c.top !== undefined ? { top: c.top } : {}),
          ...(c.bottom !== undefined ? { bottom: c.bottom } : {}),
          ...(c.left !== undefined ? { left: c.left } : {}),
          ...(c.right !== undefined ? { right: c.right } : {}),
          borderTop: c.borders.includes("borderTop") ? "1.5px solid #00d4ff" : "none",
          borderBottom: c.borders.includes("borderBottom") ? "1.5px solid #00d4ff" : "none",
          borderLeft: c.borders.includes("borderLeft") ? "1.5px solid #00d4ff" : "none",
          borderRight: c.borders.includes("borderRight") ? "1.5px solid #00d4ff" : "none",
          boxShadow: "0 0 8px rgba(0,212,255,0.5)",
        }} />
      ))}

      {/* Bottom legend strip */}
      <div style={{
        position: "absolute", bottom: 14, left: 0, right: 0, display: "flex", justifyContent: "center", gap: 22,
        fontFamily: "'Courier New', monospace", fontSize: 9, letterSpacing: 2, zIndex: 5, pointerEvents: "none",
      }}>
        {[
          { label: "FOUNDER", c: "#ffd700" },

        ].map(l => (

      </div>

      {/* Hover tooltip */}
      {hovered && (
        <div style={{
          position: "absolute", top: 50, left: "50%", transform: "translateX(-50%)",

          borderRadius: 3, fontFamily: "'Courier New', monospace", fontSize: 12,
          color: neurolinkColorFor(hovered), letterSpacing: 1.5, whiteSpace: "nowrap", zIndex: 10,

        </div>
      )}
    </div>
  );
};

const AgentCard = ({ agent, onClick, isSelected }) => {

  return (
    <div
      onClick={() => onClick(agent)}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        position: "relative",
        background: isSelected
          ? "linear-gradient(135deg, rgba(57,255,20,0.12) 0%, rgba(0,20,0,0.95) 100%)"

        overflow: "hidden",

    >
      {isSelected && <ScanLine />}
      {isLouis && (
        <div style={{ position: "absolute", top: 6, right: 8, fontSize: 8, fontFamily: "monospace", letterSpacing: 2, color: "#39ff14", background: "rgba(57,255,20,0.08)", border: "1px solid rgba(57,255,20,0.3)", padding: "1px 6px", borderRadius: 2 }}>NEW v2.3</div>

      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
        <div style={{
          width: 40, height: 40, borderRadius: "50%",
          display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20,
          background: agent.isHuman ? "linear-gradient(135deg, #39ff14 0%, #00d4ff 100%)" : "rgba(57,255,20,0.1)",
          border: `1.5px solid ${agent.isHuman ? "#39ff14" : status.color}`,
          color: agent.isHuman ? "#000" : status.color,
          boxShadow: `0 0 12px ${agent.isHuman ? "rgba(57,255,20,0.4)" : "rgba(57,255,20,0.1)"}`,

        <div style={{ flex: 1, minWidth: 0 }}>

            <span style={{ color: "#39ff14", fontFamily: "'Courier New', monospace", fontSize: 15, fontWeight: "bold", letterSpacing: 1 }}>{agent.codename}</span>
            {agent.isHuman && (
              <span style={{ fontSize: 9, padding: "1px 6px", borderRadius: 3, background: "rgba(57,255,20,0.2)", color: "#39ff14", border: "1px solid rgba(57,255,20,0.3)", letterSpacing: 1, fontFamily: "monospace" }}>HUMAN</span>

            {agent.score != null && (

        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <div style={{ width: 8, height: 8, borderRadius: "50%", background: status.color, boxShadow: status.glow, animation: agent.status === "active" || agent.status === "processing" || agent.status === "building" ? "blink 1.5s ease-in-out infinite" : "none" }} />

          <span style={{ color: "#39ff14", fontFamily: "monospace", fontSize: 10 }}>{agent.progress}%</span>
        </div>
        <div style={{ height: 3, background: "rgba(57,255,20,0.1)", borderRadius: 2, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${agent.progress}%`, background: `linear-gradient(90deg, ${status.color}, #39ff14)`, boxShadow: `0 0 6px ${status.color}`, transition: "width 0.5s ease" }} />

      </div>
      <div style={{ display: "flex", gap: 12, fontSize: 10, fontFamily: "monospace", color: "rgba(57,255,20,0.5)" }}>
        <span>\u2713 {agent.tasksCompleted}</span>
        <span>\u27F3 {agent.tasksActive}</span>
        <span>\u23F1 {agent.lastActive}</span>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════
// SKILL DATA HOOK — fetches agent_skills.json, polls every 30s
// Single source of truth. Watcher (launchd skill-rescan) regenerates the JSON
// on any filesystem change. Dashboard reflects within the next poll (≤30s).
// ═══════════════════════════════════════════════════
const useSkillData = () => {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [lastFetch, setLastFetch] = useState(null);
  const [tick, setTick] = useState(0);

  useEffect(() => {
    let alive = true;
    const fetchData = async () => {
      try {
        const r = await fetch("agent_skills.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        if (alive) {
          setData(j);
          setLastFetch(Date.now());
          setError(null);
        }
      } catch (e) {
        if (alive) setError(e.message);
      }
    };
    fetchData();
    const poll = setInterval(fetchData, 30000);
    const ticker = setInterval(() => setTick(t => t + 1), 1000);
    return () => { alive = false; clearInterval(poll); clearInterval(ticker); };
  }, []);

  // freshness — seconds since last successful fetch
  const secondsSinceFetch = lastFetch ? Math.floor((Date.now() - lastFetch) / 1000) : null;
  // freshness — seconds since the SCAN ran on disk (older than fetch time)
  const secondsSinceScan = (data && data.scanned_at_unix)
    ? Math.floor(Date.now() / 1000) - data.scanned_at_unix
    : null;

  return { data, error, secondsSinceFetch, secondsSinceScan, tick };
};

const formatAge = (sec) => {
  if (sec == null) return "—";
  if (sec < 60) return `${sec}s ago`;
  if (sec < 3600) return `${Math.floor(sec/60)}m ${sec%60}s ago`;
  if (sec < 86400) return `${Math.floor(sec/3600)}h ${Math.floor((sec%3600)/60)}m ago`;
  return `${Math.floor(sec/86400)}d ago`;
};

// TOPOLOGY MAP (lightweight SVG — Louis at center of his ties)
// ═══════════════════════════════════════════════════
const TopologyMap = ({ agents, selectedId }) => {
  const featured = ["Louis","Keystone","Architect","Venture","Forge","WOLF","Sentinel","Ledger","Self-Improving Loop","Vector","Atlas","Cornerstone","Bobby","AP"];
  const nodes = featured.map((name, i) => {
    const a = agents.find(x => x.codename === name);
    if (!a) return null;
    const angle = (i / featured.length) * Math.PI * 2 - Math.PI / 2;
    return { ...a, x: 50 + Math.cos(angle) * 36, y: 50 + Math.sin(angle) * 36, displayName: name };
  }).filter(Boolean);

  // Louis-centric edges (Louis sits at index 0, rays out to its ties)
  const louisTies = ["Keystone","Architect","Venture","Forge","WOLF","Sentinel","Ledger"];
  const louis = nodes.find(n => n.codename === "Louis");
  const edges = [];
  if (louis) {
    louisTies.forEach(t => {
      const target = nodes.find(n => n.codename === t);
      if (target) edges.push({ a: louis, b: target, kind: "louis" });
    });
  }
  // Add a few hub-and-spoke ties
  const ap = nodes.find(n => n.codename === "AP");
  if (ap) {
    ["Forge","Vector","Sentinel","Ledger","Cornerstone","Atlas"].forEach(t => {
      const target = nodes.find(n => n.codename === t);
      if (target) edges.push({ a: ap, b: target, kind: "ap" });
    });
  }
  const bobby = nodes.find(n => n.codename === "Bobby");
  if (bobby && ap) edges.push({ a: bobby, b: ap, kind: "founder" });
  const sil = nodes.find(n => n.codename === "Self-Improving Loop");
  if (sil) {
    nodes.filter(n => n.codename !== "Self-Improving Loop" && n.codename !== "Bobby").forEach(target => {
      edges.push({ a: sil, b: target, kind: "loop" });
    });
  }

  return (
    <div style={{ background: "rgba(0,5,0,0.6)", border: "1px solid rgba(57,255,20,0.15)", borderRadius: 4, padding: 12, position: "relative" }}>
      <div style={{ position: "absolute", top: 8, left: 12, color: "rgba(57,255,20,0.5)", fontFamily: "monospace", fontSize: 10, letterSpacing: 2, zIndex: 1 }}>\u25CE TOPOLOGY \u2014 LOUIS-CENTRIC + LOOP 1 PROPAGATION</div>
      <svg viewBox="0 0 100 100" style={{ width: "100%", height: 320, display: "block" }}>
        {edges.map((e, i) => {
          const stroke = e.kind === "louis" ? "rgba(57,255,20,0.55)" : e.kind === "loop" ? "rgba(0,212,255,0.18)" : e.kind === "founder" ? "rgba(255,255,255,0.6)" : "rgba(57,255,20,0.18)";
          const dash = e.kind === "loop" ? "0.8,0.8" : "none";
          return <line key={i} x1={e.a.x} y1={e.a.y} x2={e.b.x} y2={e.b.y} stroke={stroke} strokeWidth={e.kind === "louis" ? 0.4 : 0.2} strokeDasharray={dash} />;
        })}
        {nodes.map(n => {
          const isLouis = n.codename === "Louis";
          const isFounder = n.codename === "Bobby";
          const isSelected = selectedId === n.id;
          const fill = isFounder ? "#ffffff" : isLouis ? "#39ff14" : (n.tier === 1 ? "#39ff14" : n.tier === 2 ? "#b388ff" : n.tier === 3 ? "#88aaff" : n.tier === 4 ? "#00d4ff" : "rgba(170,238,255,0.7)");
          const r = isLouis ? 3.2 : isFounder ? 2.6 : 2.0;
          return (
            <g key={n.id}>
              <circle cx={n.x} cy={n.y} r={r} fill={`rgba(${hexToRgb(typeof fill === "string" && fill.startsWith("#") ? fill : "#39ff14")},0.18)`} stroke={fill} strokeWidth={isLouis || isSelected ? 0.5 : 0.3} />
              <text x={n.x} y={n.y + r + 2.6} fill={isLouis ? "#39ff14" : "rgba(57,255,20,0.6)"} fontSize="2.4" fontFamily="monospace" textAnchor="middle" fontWeight={isLouis ? "bold" : "normal"}>{n.displayName.length > 14 ? n.displayName.slice(0,12)+".." : n.displayName.toUpperCase()}</text>
            </g>
          );
        })}
      </svg>
      <div style={{ display: "flex", gap: 14, fontSize: 9, fontFamily: "monospace", letterSpacing: 1, color: "rgba(57,255,20,0.45)", marginTop: 6, flexWrap: "wrap" }}>
        <span><span style={{ color: "#39ff14" }}>\u25CF</span> Louis ties</span>
        <span><span style={{ color: "#00d4ff" }}>\u00B7\u00B7\u00B7</span> Loop 1 (Self-Improving) reach</span>
        <span><span style={{ color: "#ffffff" }}>\u25CF</span> Founder \u2192 CEO</span>
        <span><span style={{ color: "#b388ff" }}>\u25CF</span> Tier 2 build queue</span>
      </div>
    </div>
  );
};
