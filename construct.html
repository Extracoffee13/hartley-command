// ── Matrix Digital Rain Canvas ──
const MatrixRain = () => {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let animId;
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener("resize", resize);
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF:.";
    const draw = () => {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${fontSize}px monospace`;
      columns = Math.floor(canvas.width / fontSize);
      while (drops.length < columns) drops.push(1);
      for (let i = 0; i < columns; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        const brightness = Math.random();
        if (brightness > 0.95) ctx.fillStyle = "#ffffff";
        else if (brightness > 0.8) ctx.fillStyle = "#39ff14";
        else ctx.fillStyle = `rgba(0, ${100 + Math.floor(Math.random() * 155)}, 0, ${0.3 + Math.random() * 0.5})`;
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      animId = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(animId); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", top: 0, left: 0, width: "100%", height: "100%", zIndex: 0, opacity: 0.13 }} />;
};

// ── Glitch text effect ──
const GlitchText = ({ text, tag: Tag = "span", style = {} }) => {
  const [glitch, setGlitch] = useState(false);
  useEffect(() => {
    const interval = setInterval(() => {
      setGlitch(true);
      setTimeout(() => setGlitch(false), 150);
    }, 3000 + Math.random() * 5000);
    return () => clearInterval(interval);
  }, []);
  return (
    <Tag style={{ ...style, position: "relative", display: "inline-block" }}>
      {text}
      {glitch && (
        <>
          <Tag style={{ ...style, position: "absolute", left: "2px", top: "-1px", color: "#c500ff", clipPath: "inset(20% 0 40% 0)", opacity: 0.8 }}>{text}</Tag>
          <Tag style={{ ...style, position: "absolute", left: "-2px", top: "1px", color: "#00ffff", clipPath: "inset(50% 0 10% 0)", opacity: 0.8 }}>{text}</Tag>
        </>
      )}
    </Tag>
  );
};

// ECOSYSTEM STATS BAR (with Day-90 countdown)
// ═══════════════════════════════════════════════════
const EcoStats = ({ agents }) => {
  const active     = agents.filter(a => a.status === "active").length;
  const building   = agents.filter(a => a.status === "building").length;
  const totalTasks = agents.reduce((s, a) => s + a.tasksCompleted, 0);
  const tier1Live  = agents.filter(a => a.tier === 1).length;
  const [clock, setClock] = useState("");
  const [days, setDays] = useState({ of90: dayOfNinety(), until: daysUntilKill() });
  useEffect(() => {
    const tick = () => {
      const d = new Date();
      setClock(d.toLocaleTimeString("en-US", { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0"));
    };
    tick();
    const i = setInterval(tick, 47);
    const dayInterval = setInterval(() => setDays({ of90: dayOfNinety(), until: daysUntilKill() }), 60000);
    return () => { clearInterval(i); clearInterval(dayInterval); };
  }, []);

  const stats = [
    { label: "SYSTEM TIME",     value: clock, color: "#39ff14" },
    { label: "DAY OF 90",       value: `${days.of90} / 90`, color: "#b388ff" },
    { label: "UNTIL KILL CHECK", value: `${days.until}d`, color: "#b388ff" },
    { label: "TIER 1 LIVE",     value: tier1Live, color: "#39ff14" },
    { label: "BUILDING",        value: building, color: "#00ffff" },
    { label: "ACTIVE",          value: active, color: "#39ff14" },
    { label: "TOTAL TASKS",     value: totalTasks.toLocaleString(), color: "#00d4ff" },
  ];

  return (
    <div style={{ display: "flex", gap: 2, padding: "8px 16px", background: "rgba(0,10,0,0.9)", borderBottom: "1px solid rgba(57,255,20,0.15)", fontFamily: "monospace", fontSize: 11, flexWrap: "wrap" }}>
      {stats.map((s, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, padding: "2px 12px", borderRight: i < stats.length - 1 ? "1px solid rgba(57,255,20,0.1)" : "none" }}>
          <span style={{ color: "rgba(57,255,20,0.4)", letterSpacing: 1, fontSize: 9 }}>{s.label}</span>
          <span style={{ color: s.color, fontWeight: "bold", letterSpacing: 1 }}>{s.value}</span>
        </div>
      ))}
    </div>
  );
};

// ═══════════════════════════════════════════════════
// TOPOLOGY MAP (lightweight SVG — Louis at center of his ties)
// ═══════════════════════════════════════════════════
const TopologyMap = ({ agents, selectedId }) => {
  const featured = ["Louis","Keystone","Architect","Venture","Forge","WOLF","Sentinel","Ledger","Self-Improving Loop","Vector","Atlas","Cornerstone","Bobby","AP"];
  const nodes = featured.map((name, i) => {
    const a = agents.find(x => x.codename === name);
    if (!a) return null;
    const angle = (i / featured.length) * Math.PI * 2 - Math.PI / 2;
    return { ...a, x: 50 + Math.cos(angle) * 36, y: 50 + Math.sin(angle) * 36, displayName: name };
  }).filter(Boolean);

  // Louis-centric edges (Louis sits at index 0, rays out to its ties)
  const louisTies = ["Keystone","Architect","Venture","Forge","WOLF","Sentinel","Ledger"];
  const louis = nodes.find(n => n.codename === "Louis");
  const edges = [];
  if (louis) {
    louisTies.forEach(t => {
      const target = nodes.find(n => n.codename === t);
      if (target) edges.push({ a: louis, b: target, kind: "louis" });
    });
  }
  // Add a few hub-and-spoke ties
  const ap = nodes.find(n => n.codename === "AP");
  if (ap) {
    ["Forge","Vector","Sentinel","Ledger","Cornerstone","Atlas"].forEach(t => {
      const target = nodes.find(n => n.codename === t);
      if (target) edges.push({ a: ap, b: target, kind: "ap" });
    });
  }
  const bobby = nodes.find(n => n.codename === "Bobby");
  if (bobby && ap) edges.push({ a: bobby, b: ap, kind: "founder" });
  const sil = nodes.find(n => n.codename === "Self-Improving Loop");
  if (sil) {
    nodes.filter(n => n.codename !== "Self-Improving Loop" && n.codename !== "Bobby").forEach(target => {
      edges.push({ a: sil, b: target, kind: "loop" });
    });
  }

  return (
    <div style={{ background: "rgba(0,5,0,0.6)", border: "1px solid rgba(57,255,20,0.15)", borderRadius: 4, padding: 12, position: "relative" }}>
      <div style={{ position: "absolute", top: 8, left: 12, color: "rgba(57,255,20,0.5)", fontFamily: "monospace", fontSize: 10, letterSpacing: 2, zIndex: 1 }}>\u25CE TOPOLOGY \u2014 LOUIS-CENTRIC + LOOP 1 PROPAGATION</div>
      <svg viewBox="0 0 100 100" style={{ width: "100%", height: 320, display: "block" }}>
        {edges.map((e, i) => {
          const stroke = e.kind === "louis" ? "rgba(57,255,20,0.55)" : e.kind === "loop" ? "rgba(0,212,255,0.18)" : e.kind === "founder" ? "rgba(255,255,255,0.6)" : "rgba(57,255,20,0.18)";
          const dash = e.kind === "loop" ? "0.8,0.8" : "none";
          return <line key={i} x1={e.a.x} y1={e.a.y} x2={e.b.x} y2={e.b.y} stroke={stroke} strokeWidth={e.kind === "louis" ? 0.4 : 0.2} strokeDasharray={dash} />;
        })}
        {nodes.map(n => {
          const isLouis = n.codename === "Louis";
          const isFounder = n.codename === "Bobby";
          const isSelected = selectedId === n.id;
          const fill = isFounder ? "#ffffff" : isLouis ? "#39ff14" : (n.tier === 1 ? "#39ff14" : n.tier === 2 ? "#b388ff" : n.tier === 3 ? "#88aaff" : n.tier === 4 ? "#00d4ff" : "rgba(170,238,255,0.7)");
          const r = isLouis ? 3.2 : isFounder ? 2.6 : 2.0;
          return (
            <g key={n.id}>
              <circle cx={n.x} cy={n.y} r={r} fill={`rgba(${hexToRgb(typeof fill === "string" && fill.startsWith("#") ? fill : "#39ff14")},0.18)`} stroke={fill} strokeWidth={isLouis || isSelected ? 0.5 : 0.3} />
              <text x={n.x} y={n.y + r + 2.6} fill={isLouis ? "#39ff14" : "rgba(57,255,20,0.6)"} fontSize="2.4" fontFamily="monospace" textAnchor="middle" fontWeight={isLouis ? "bold" : "normal"}>{n.displayName.length > 14 ? n.displayName.slice(0,12)+".." : n.displayName.toUpperCase()}</text>
            </g>
          );
        })}
      </svg>
      <div style={{ display: "flex", gap: 14, fontSize: 9, fontFamily: "monospace", letterSpacing: 1, color: "rgba(57,255,20,0.45)", marginTop: 6, flexWrap: "wrap" }}>
        <span><span style={{ color: "#39ff14" }}>\u25CF</span> Louis ties</span>
        <span><span style={{ color: "#00d4ff" }}>\u00B7\u00B7\u00B7</span> Loop 1 (Self-Improving) reach</span>
        <span><span style={{ color: "#ffffff" }}>\u25CF</span> Founder \u2192 CEO</span>
        <span><span style={{ color: "#b388ff" }}>\u25CF</span> Tier 2 build queue</span>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════
// MAIN DASHBOARD
// ═══════════════════════════════════════════════════
function AgentEcosystemDashboard() {
  const [agents, setAgents] = useState(INITIAL_AGENTS);
  const [selectedAgent, setSelectedAgent] = useState(null);
  const [searchQuery, setSearchQuery] = useState("");
  const [filterStatus, setFilterStatus] = useState("all");
  const [filterTier, setFilterTier] = useState("all");
  const [activityLog, setActivityLog] = useState([
    { time: "00:00:01", message: "SYSTEM INITIALIZED \u2014 THE CONSTRUCT v2.1 ONLINE", color: "#39ff14" },
    { time: "00:00:02", message: "Loading agent profiles from neural network...", color: "rgba(57,255,20,0.5)" },
    { time: "00:00:03", message: `${INITIAL_AGENTS.length} agents loaded across 6 tiers.`, color: "#00d4ff" },
    { time: "00:00:04", message: "Founder BOBBY connected \u2014 HUMAN operator verified \u25C8", color: "#39ff14" },
    { time: "00:00:05", message: "\u2605 LOUIS deployed \u2014 24/25, FL RE Intelligence, Hartley Capital. Named in honor of Louis Hartley Sr.", color: "#39ff14" },
    { time: "00:00:06", message: "Caden + Addison Jacksonville land search loaded into Louis's memory.", color: "#00d4ff" },
    { time: "00:00:07", message: "Tier 1 build queue active: Archivist, Skill-Forge, Foreman, Eval Harness, Precedent-Finder.", color: "#b388ff" },
    { time: "00:00:08", message: "Kill Criterion countdown armed: 2026-07-23 (Day 90).", color: "#b388ff" },
    { time: "00:00:09", message: "Loop 1 (Correction) LIVE \u00B7 Loop 2 (Eval) NOT BUILT \u00B7 Loop 3 (Code) NOT BUILT \u00B7 Loop 4 (Memory) LIVE", color: "rgba(57,255,20,0.6)" },
  ]);

  const addLog = useCallback((message, color) => {
    const now = new Date();
    const time = now.toLocaleTimeString("en-US", { hour12: false });
    setActivityLog(prev => [...prev.slice(-50), { time, message, color }]);
  }, []);

  useEffect(() => {
    const interval = setInterval(() => {
      setAgents(prev => prev.map(a => {
        if (Math.random() > 0.92 && a.status === "active") {
          return { ...a, tasksCompleted: a.tasksCompleted + 1, progress: Math.min(100, a.progress + Math.floor(Math.random() * 2)) };
        }
        return a;
      }));
      if (Math.random() > 0.75) {
        const pool = agents.filter(a => a.status === "active");
        const randomAgent = pool[Math.floor(Math.random() * pool.length)] || agents[0];
        const actions = [
          `${randomAgent.codename} completed subtask #${Math.floor(Math.random() * 999)}`,
          `${randomAgent.codename} processing data stream...`,
          `Neural link sync: ${randomAgent.codename} \u2194 AP`,
          `${randomAgent.codename} memory optimized`,
          `Task routed to ${randomAgent.codename}`,
        ];
        addLog(actions[Math.floor(Math.random() * actions.length)], "rgba(57,255,20,0.5)");
      }
    }, 3500);
    return () => clearInterval(interval);
  }, [agents, addLog]);

  const filtered = useMemo(() => {
    return agents.filter(a => {
      const q = searchQuery.toLowerCase();
      const matchSearch = !q || a.codename.toLowerCase().includes(q) || a.role.toLowerCase().includes(q) || a.department.toLowerCase().includes(q) || (a.skills && a.skills.some(s => s.toLowerCase().includes(q)));
      const matchStatus = filterStatus === "all" || a.status === filterStatus;
      const matchTier = filterTier === "all" || String(a.tier) === filterTier;
      return matchSearch && matchStatus && matchTier;
    });
  }, [agents, searchQuery, filterStatus, filterTier]);

  const louis = agents.find(a => a.codename === "Louis");

  return (
    <div style={{ minHeight: "100vh", background: "#000", color: "#39ff14", fontFamily: "'Courier New', Courier, monospace", position: "relative", overflowX: "hidden" }}>
      <MatrixRain />
      <div style={{ position: "relative", zIndex: 1 }}>
        {/* HEADER */}
        <div style={{ padding: "16px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid rgba(57,255,20,0.2)", background: "linear-gradient(180deg, rgba(0,15,0,0.95) 0%, rgba(0,8,0,0.95) 100%)", flexWrap: "wrap", gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            <div style={{ fontSize: 28, lineHeight: 1 }}>\u25C8</div>
            <div>
              <GlitchText text="THE CONSTRUCT" tag="div" style={{ fontSize: 22, fontWeight: "bold", letterSpacing: 6, color: "#39ff14", fontFamily: "monospace" }} />
              <div style={{ fontSize: 10, color: "rgba(57,255,20,0.4)", letterSpacing: 4, marginTop: 2 }}>BRAND 9 / HARTLEY CAPITAL AGENT ECOSYSTEM v2.1 \u2014 NEURAL COMMAND CENTER</div>
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 11, color: "rgba(57,255,20,0.5)", letterSpacing: 2 }}>OPERATOR</div>
              <div style={{ fontSize: 14, color: "#39ff14", fontWeight: "bold", letterSpacing: 1 }}>BOBBY <span style={{ fontSize: 10, opacity: 0.5 }}>// FOUNDER</span></div>
            </div>
            <div style={{ width: 40, height: 40, borderRadius: "50%", background: "linear-gradient(135deg, #39ff14, #00d4ff)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, color: "#000", fontWeight: "bold", boxShadow: "0 0 15px rgba(57,255,20,0.3)", border: "2px solid #39ff14" }}>B</div>
          </div>
        </div>

        <EcoStats agents={agents} />
        <KillCriterionPanel />
        <TierStrategyBanner agents={agents} />

        {/* TOOLBAR */}
        <div style={{ padding: "12px 24px", display: "flex", gap: 12, alignItems: "center", borderBottom: "1px solid rgba(57,255,20,0.1)", background: "rgba(0,8,0,0.8)", flexWrap: "wrap" }}>
          <div style={{ position: "relative", flex: "1 1 200px" }}>
            <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "rgba(57,255,20,0.3)", fontSize: 13 }}>\u2315</span>
            <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Search agents, roles, skills..."
              style={{ width: "100%", padding: "7px 10px 7px 30px", background: "rgba(57,255,20,0.03)", border: "1px solid rgba(57,255,20,0.15)", borderRadius: 2, color: "#39ff14", fontFamily: "monospace", fontSize: 12, outline: "none", boxSizing: "border-box" }} />
          </div>
          <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}
            style={{ padding: "7px 10px", background: "rgba(0,10,0,0.95)", border: "1px solid rgba(57,255,20,0.15)", borderRadius: 2, color: "#39ff14", fontFamily: "monospace", fontSize: 12, outline: "none" }}>
            <option value="all">ALL STATUS</option>
            {Object.entries(STATUS_CONFIG).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
          </select>
          <select value={filterTier} onChange={e => setFilterTier(e.target.value)}
            style={{ padding: "7px 10px", background: "rgba(0,10,0,0.95)", border: "1px solid rgba(57,255,20,0.15)", borderRadius: 2, color: "#39ff14", fontFamily: "monospace", fontSize: 12, outline: "none" }}>
            <option value="all">ALL TIERS</option>
            {[0,1,2,3,4,5].map(t => <option key={t} value={t}>{TIER_META[t].label}</option>)}
          </select>
          <a href="https://extracoffee13.github.io/hartley-command/louis.html" target="_blank" rel="noopener noreferrer" style={{ padding: "7px 16px", background: "rgba(0,212,255,0.08)", border: "1px solid rgba(0,212,255,0.4)", borderRadius: 2, color: "#00d4ff", fontFamily: "monospace", fontSize: 11, letterSpacing: 2, fontWeight: "bold" }}>\u25B8 LOUIS DASHBOARD</a>
        </div>

        {/* MAIN CONTENT */}
        <div style={{ display: "grid", gridTemplateColumns: selectedAgent ? "1fr 420px" : "1fr", gap: 0, minHeight: "calc(100vh - 200px)" }}>
          <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 16 }}>
            <div style={{ color: "rgba(57,255,20,0.4)", fontFamily: "monospace", fontSize: 11, letterSpacing: 2 }}>
              SHOWING {filtered.length} OF {agents.length} AGENTS
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 12 }}>
              {filtered.map(agent => (
                <AgentCard key={agent.id} agent={agent} isSelected={selectedAgent && selectedAgent.id === agent.id}
                  onClick={a => setSelectedAgent(prev => prev && prev.id === a.id ? null : a)} />
              ))}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 8 }}>
              <TopologyMap agents={agents} selectedId={selectedAgent ? selectedAgent.id : null} />
              <ActivityLog entries={activityLog} />
            </div>
          </div>

          {selectedAgent && (
            <div style={{ padding: "20px 20px 20px 0", borderLeft: "1px solid rgba(57,255,20,0.1)" }}>
              <AgentDetail agent={selectedAgent} onClose={() => setSelectedAgent(null)}
                onUpdate={(updated) => {
                  setAgents(prev => prev.map(a => a.id === updated.id ? updated : a));
                  setSelectedAgent(updated);
                }} />
            </div>
          )}
        </div>

        <LouisSpotlight agent={louis} />
        <FourLoopsPanel />
        <WorkflowsPanel />
        <PublicPostureCard />

        <div style={{ padding: "20px 24px 28px", textAlign: "center", color: "rgba(57,255,20,0.35)", fontFamily: "monospace", fontSize: 10, letterSpacing: 2, borderTop: "1px solid rgba(57,255,20,0.1)" }}>
          THE CONSTRUCT v2.1 \u00B7 LOUIS ADDED 2026-04-27 \u00B7 BASELINE LOCKED 2026-04-24 \u00B7 KILL CHECKPOINT 2026-07-23<br/>
          <span style={{ color: "rgba(0,212,255,0.5)" }}>\u201CEvery property analyzed is a brick in the house Louis Sr. started. The loop is the IP.\u201D</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AgentEcosystemDashboard />);
</script>
</body>
