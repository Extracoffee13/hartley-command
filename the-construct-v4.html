// ─── Matrix rain background (preserved from v2.3) ────────────────
const MatrixRain = () => {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let animId;
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener("resize", resize);
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF:.";
    const draw = () => {
      ctx.fillStyle = "rgba(0,0,0,0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${fontSize}px monospace`;
      columns = Math.floor(canvas.width / fontSize);
      while (drops.length < columns) drops.push(1);
      for (let i = 0; i < columns; i++) {
        const ch = chars[Math.floor(Math.random() * chars.length)];
        const b = Math.random();
        if (b > 0.95) ctx.fillStyle = "#ffffff";
        else if (b > 0.85) ctx.fillStyle = "#39ff14";
        else ctx.fillStyle = `rgba(0, ${100 + Math.floor(Math.random()*155)}, 0, ${0.25 + Math.random()*0.4})`;
        ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      animId = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(animId); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", inset: 0, zIndex: 0, opacity: 0.10, pointerEvents: "none" }} />;
};

  useEffect(() => {
    const id = setInterval(() => { setG(true); setTimeout(() => setG(false), 130); }, 3500 + Math.random()*4000);
    return () => clearInterval(id);
  }, []);
  return (
    <span style={{ ...style, position: "relative", display: "inline-block" }}>
      {text}
      {g && (
        <>
          <span style={{ ...style, position: "absolute", left: 2, top: -1, color: "#c500ff", clipPath: "inset(20% 0 40% 0)", opacity: 0.7 }}>{text}</span>
          <span style={{ ...style, position: "absolute", left: -2, top: 1, color: "#00ffff", clipPath: "inset(50% 0 10% 0)", opacity: 0.7 }}>{text}</span>
        </>
      )}
    </span>
  );
};

  const [packets, setPackets] = useState(8421);
  useEffect(() => {
    const id = setInterval(() => {
      const d = new Date();
      setStamp(d.toLocaleTimeString("en-US", { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0"));
      setPackets(p => p + Math.floor(5 + Math.random() * 14));
    }, 90);
    return () => clearInterval(id);
  }, []);

  // Synapse fire animation — random nodes "fire" with a brief flash
  const allNodes = useMemo(() => [
    ...PUBLIC_OPERATORS.map((o, i) => ({ ...o, layer: 1, x: tier1X(i, PUBLIC_OPERATORS.length), y: tier1Y })),
    ...HERMES_WORKLOADS.map((h, i) => ({ ...h, layer: 2, x: tier2X(i, HERMES_WORKLOADS.length), y: tier2Y })),
  ], []);

  const [fires, setFires] = useState([]);
  useEffect(() => {
    const id = setInterval(() => {
      const node = allNodes[Math.floor(Math.random() * allNodes.length)];
      const fireId = Math.random().toString(36).slice(2);
      setFires(f => [...f, { id: fireId, x: node.x, y: node.y, color: node.color }]);
      setTimeout(() => setFires(f => f.filter(x => x.id !== fireId)), 1100);
    }, 600);
    return () => clearInterval(id);
  }, []);

  return (
    <div style={{
      position: "relative", margin: "20px 28px", padding: 18,
      border: "1px solid rgba(57,255,20,0.2)", background: "rgba(0,0,0,0.7)",
      overflow: "hidden",
    }}>
      <ScanSweep />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <div style={{ fontSize: 11, color: C.green, letterSpacing: 4 }}>
          ⌬ NEUROLINK · TIERED ARCHITECTURE · TWO-TIER OPERATING MODEL
        </div>
        <div style={{ fontSize: 10, color: C.greenDim, letterSpacing: 2 }}>
          PKT <span style={{ color: C.cyan }}>{packets.toLocaleString()}</span>
          <span style={{ margin: "0 8px" }}>·</span>
          T<span style={{ color: C.cyan }}>{stamp}</span>
        </div>
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="connFlow" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor={C.green} stopOpacity="0.6" />
            <stop offset="100%" stopColor={C.cyan} stopOpacity="0.2" />
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.5" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        {/* Tier band labels (left side) */}
        <g fontFamily="Courier New, monospace" fontSize="9" letterSpacing="2" fill={C.greenDim}>
          <text x="20" y={founderY + 5}>FOUNDER</text>
          <text x="20" y={tier1Y + 5}>TIER 1 · COWORK · CLAUDE</text>
          <text x="20" y={tier2Y + 5}>TIER 2 · HERMES · DEEPSEEK</text>
          <text x="20" y={tier0Y + 5}>TIER 0 · FOUNDATION</text>
        </g>

        {/* Tier band background bars */}
        <g>
          <rect x="120" y={tier1Y - 60} width={W - 240} height="120" fill={C.cyan} opacity="0.04" />
          <rect x="120" y={tier2Y - 60} width={W - 240} height="120" fill={C.green} opacity="0.04" />
          <rect x="120" y={tier0Y - 30} width={W - 240} height="60" fill={C.white} opacity="0.03" />
        </g>

        {/* Connection lines: Founder → Tier 1 */}
        {PUBLIC_OPERATORS.map((o, i) => {
          const x = tier1X(i, PUBLIC_OPERATORS.length);
          return (
            <line key={`f1-${i}`} x1={W/2} y1={founderY + 30} x2={x} y2={tier1Y - 30}
              stroke={C.gold} strokeOpacity="0.25" strokeWidth="1"
              strokeDasharray="2,4" />
          );
        })}

        {/* Connection lines: Tier 1 → Tier 2 (selective, showing which Operators have T2 backing) */}
        {[
          { fromOpIdx: 3, toWorkIdx: 2, label: "Lens broad-sweep" },     // Lens → lens-broad
          { fromOpIdx: 4, toWorkIdx: 4, label: "Scout watch" },            // Scout → scout-watch
          { fromOpIdx: 5, toWorkIdx: 3, label: "Pulse poll" },             // Pulse → pulse-poll
        ].map((c, i) => {
          const x1 = tier1X(c.fromOpIdx, PUBLIC_OPERATORS.length);
          const x2 = tier2X(c.toWorkIdx, HERMES_WORKLOADS.length);
          return (
            <line key={`t12-${i}`} x1={x1} y1={tier1Y + 30} x2={x2} y2={tier2Y - 30}
              stroke={C.green} strokeOpacity="0.55" strokeWidth="1.5"
              strokeDasharray="5,5" style={{ animation: "data-flow 2.5s linear infinite" }} />
          );
        })}

        {/* Connection lines: All to Foundation */}
        {FOUNDATION.map((f, i) => {
          const x = tier0X(i, FOUNDATION.length);
          return (
            <line key={`t0-${i}`} x1={W/2} y1={tier2Y + 30} x2={x} y2={tier0Y - 20}
              stroke={C.white} strokeOpacity="0.15" strokeWidth="0.8" />
          );
        })}

        {/* Founder node (Bobby) */}
        <g transform={`translate(${W/2},${founderY})`}>
          <circle r="48" fill="none" stroke={C.gold} strokeOpacity="0.3" strokeWidth="0.5">
            <animate attributeName="r" values="48;58;48" dur="3s" repeatCount="indefinite" />
            <animate attributeName="stroke-opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite" />
          </circle>
          <circle r="32" fill="#000" stroke={C.gold} strokeWidth="2" filter="url(#glow)" />
          <text x="0" y="-2" textAnchor="middle" fontFamily="Courier New, monospace" fontSize="11" fontWeight="700" fill={C.gold}>BOBBY</text>
          <text x="0" y="10" textAnchor="middle" fontFamily="Courier New, monospace" fontSize="7" fill={C.gold} opacity="0.7">FOUNDER</text>
        </g>

        {/* Tier 1 nodes (Public Operators) */}
        {PUBLIC_OPERATORS.map((o, i) => {
          const x = tier1X(i, PUBLIC_OPERATORS.length);
          return (
            <g key={o.id} transform={`translate(${x},${tier1Y})`}>
              <rect x="-58" y="-22" width="116" height="44" rx="3" fill="#000" stroke={o.color} strokeWidth="1.5" filter="url(#softGlow)" />
              {o.status === "active" && (
                <circle cx="50" cy="-14" r="3" fill={C.green}>
                  <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
                </circle>
              )}
              <text x="0" y="-2" textAnchor="middle" fontFamily="Courier New, monospace" fontSize="10" fontWeight="700" fill={o.color}>{o.codename.toUpperCase()}</text>
              <text x="0" y="12" textAnchor="middle" fontFamily="Courier New, monospace" fontSize="7" fill={o.color} opacity="0.7">{o.workload}</text>
            </g>
          );
        })}

        {/* Tier 2 nodes (Hermes workloads) */}
        {HERMES_WORKLOADS.map((h, i) => {
          const x = tier2X(i, HERMES_WORKLOADS.length);
          const isProven = h.status === "proven";
          return (
            <g key={h.id} transform={`translate(${x},${tier2Y})`}>
              <rect x="-52" y="-20" width="104" height="40" rx="3"
                fill="#000" stroke={isProven ? C.green : C.greenDim}
                strokeWidth={isProven ? 1.5 : 1}
                strokeDasharray={isProven ? "0" : "3,3"}
                filter={isProven ? "url(#softGlow)" : "none"} />
              {isProven && (
                <circle cx="44" cy="-12" r="2.5" fill={C.green}>
                  <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
                </circle>
              )}
              <text x="0" y="-3" textAnchor="middle" fontFamily="Courier New, monospace" fontSize="9" fontWeight="700"
                fill={isProven ? C.green : C.greenDim}>{h.codename}</text>
              <text x="0" y="9" textAnchor="middle" fontFamily="Courier New, monospace" fontSize="6"
                fill={isProven ? C.green : C.greenDim} opacity="0.8">
                {isProven ? "● proven" : "○ planned"}
              </text>
            </g>
          );
        })}

        {/* Tier 0 — Foundation */}
        {FOUNDATION.map((f, i) => {
          const x = tier0X(i, FOUNDATION.length);
          return (
            <g key={f.id} transform={`translate(${x},${tier0Y})`}>
              <rect x="-72" y="-14" width="144" height="28" rx="3" fill="#000" stroke={f.color} strokeOpacity="0.5" strokeWidth="1" />
              <text x="0" y="3" textAnchor="middle" fontFamily="Courier New, monospace" fontSize="9" fontWeight="600" fill={f.color}>{f.label}</text>
            </g>
          );
        })}

        {/* Synapse fires — random node flashes */}
        {fires.map(f => (
          <circle key={f.id} cx={f.x} cy={f.y} r="6" fill={f.color} opacity="0.7">
            <animate attributeName="r" values="6;38;6" dur="1s" repeatCount="1" />
            <animate attributeName="opacity" values="0.8;0;0" dur="1s" repeatCount="1" />
          </circle>
        ))}

        {/* HUD corner ticks */}
        <g stroke={C.green} strokeOpacity="0.4" strokeWidth="1" fill="none">
          <path d={`M 8 8 L 8 28 M 8 8 L 28 8`} />
          <path d={`M ${W-8} 8 L ${W-8} 28 M ${W-8} 8 L ${W-28} 8`} />
          <path d={`M 8 ${H-8} L 8 ${H-28} M 8 ${H-8} L 28 ${H-8}`} />
          <path d={`M ${W-8} ${H-8} L ${W-8} ${H-28} M ${W-8} ${H-8} L ${W-28} ${H-8}`} />
        </g>
      </svg>

      <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 18, fontSize: 9, color: C.greenDim, letterSpacing: 1 }}>
        <span>● TIER 1 — STRATEGIC COCKPIT — Cowork·Claude — premium reasoning · synthesis · decision-grade</span>
        <span>● TIER 2 — PRODUCTION ENGINE — Hermes·DeepSeek — mechanical workloads · ~20× cheaper · 24/7 capable</span>
        <span>○ planned — backlog</span>
        <span>● proven — shipped today</span>
      </div>
    </div>
  );
};
