// ─── Matrix rain background (preserved from v2.3) ────────────────
const MatrixRain = () => {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let animId;
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener("resize", resize);
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF:.";
    const draw = () => {
      ctx.fillStyle = "rgba(0,0,0,0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${fontSize}px monospace`;
      columns = Math.floor(canvas.width / fontSize);
      while (drops.length < columns) drops.push(1);
      for (let i = 0; i < columns; i++) {
        const ch = chars[Math.floor(Math.random() * chars.length)];
        const b = Math.random();
        if (b > 0.95) ctx.fillStyle = "#ffffff";
        else if (b > 0.85) ctx.fillStyle = "#39ff14";
        else ctx.fillStyle = `rgba(0, ${100 + Math.floor(Math.random()*155)}, 0, ${0.25 + Math.random()*0.4})`;
        ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      animId = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(animId); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", inset: 0, zIndex: 0, opacity: 0.10, pointerEvents: "none" }} />;
};

const GlitchText = ({ text, style = {} }) => {
  const [g, setG] = useState(false);
  useEffect(() => {
    const id = setInterval(() => { setG(true); setTimeout(() => setG(false), 130); }, 3500 + Math.random()*4000);
    return () => clearInterval(id);
  }, []);
  return (
    <span style={{ ...style, position: "relative", display: "inline-block" }}>
      {text}
      {g && (
        <>
          <span style={{ ...style, position: "absolute", left: 2, top: -1, color: "#c500ff", clipPath: "inset(20% 0 40% 0)", opacity: 0.7 }}>{text}</span>
          <span style={{ ...style, position: "absolute", left: -2, top: 1, color: "#00ffff", clipPath: "inset(50% 0 10% 0)", opacity: 0.7 }}>{text}</span>
        </>
      )}
    </span>
  );
};

        {/* Tier band labels (left side) */}

        {/* Tier band background bars */}
