// ─── Matrix rain background (preserved from v2.3) ────────────────
const MatrixRain = () => {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let animId;
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener("resize", resize);
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF:.";
    const draw = () => {
      ctx.fillStyle = "rgba(0,0,0,0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${fontSize}px monospace`;
      columns = Math.floor(canvas.width / fontSize);
      while (drops.length < columns) drops.push(1);
      for (let i = 0; i < columns; i++) {
        const ch = chars[Math.floor(Math.random() * chars.length)];
        const b = Math.random();
        if (b > 0.95) ctx.fillStyle = "#ffffff";
        else if (b > 0.85) ctx.fillStyle = "#39ff14";
        else ctx.fillStyle = `rgba(0, ${100 + Math.floor(Math.random()*155)}, 0, ${0.25 + Math.random()*0.4})`;
        ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      animId = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(animId); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", inset: 0, zIndex: 0, opacity: 0.10, pointerEvents: "none" }} />;
};

const ClaudeTokenMeterPanel = () => {
  const [data, setData] = React.useState(null);
  const [fetched, setFetched] = React.useState(false);
  React.useEffect(() => {
    (async () => {
      const urls = [
        './claude-token-meter.json?cb=' + Date.now(),
        'https://extracoffee13.github.io/hartley-command/claude-token-meter.json?cb=' + Date.now(),

      }
      setFetched(true);
    })();
  }, []);

  const wl = (data && data.weekly_limit) || {};
  const pct = wl.pct_used;
  const pctColor = pct == null ? C.greenDim : (pct >= 80 ? C.red : pct >= 60 ? C.gold : C.green);
  const models = (data && data.models) || [];
  const gradeColor = (g) => g == null ? C.greenDim : (String(g).startsWith('A') ? C.green : String(g).startsWith('B') ? C.cyan : String(g).startsWith('C') ? C.gold : C.red);
  const fmt = (v) => (v == null ? '—' : Number(v).toLocaleString());

  const td = { color: 'rgba(255,255,255,0.82)', fontSize: 10, textAlign: 'right', padding: '5px 6px', borderBottom: '1px solid rgba(255,255,255,0.05)', fontVariantNumeric: 'tabular-nums' };
  const tdL = { ...td, textAlign: 'left' };

  return (
    <div style={{ margin: '20px 28px', padding: 18, border: `2px solid ${C.gold}`, background: 'rgba(255,215,0,0.03)', position: 'relative' }}>
      <div style={{ position: 'absolute', top: -10, left: 16, padding: '0 8px', background: '#000', fontSize: 10, color: C.gold, letterSpacing: 4 }}>

          <div style={{ fontSize: 20, fontWeight: 900, color: C.gold, fontFamily: 'Georgia, serif' }}>Weekly Claude Budget</div>
          <div style={{ fontSize: 9, color: C.greenDim, marginTop: 2 }}>{wl.window || 'rolling 7d'} · {(data && data.source) || ''}</div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div style={{ fontSize: 9, color: C.greenDim, letterSpacing: 2 }}>WEEKLY LIMIT USED</div>
          <div style={{ fontSize: 36, fontWeight: 900, color: pctColor, fontFamily: 'monospace' }}>{pct == null ? '--' : pct + '%'}</div>
        </div>
      </div>

      <div style={{ height: 12, background: 'rgba(255,255,255,0.08)', borderRadius: 6, overflow: 'hidden', marginBottom: 4 }}>
        <div style={{ width: (pct == null ? 0 : Math.min(pct, 100)) + '%', height: '100%', background: pctColor, transition: 'width .4s' }} />
      </div>
      <div style={{ fontSize: 8, color: C.greenDim, marginBottom: 14 }}>{wl.note || ''}</div>

      <div style={{ fontSize: 9, color: C.gold, letterSpacing: 2, marginBottom: 6 }}>MODELS IN USE — TOKENS · COST · GRADE</div>
      {!fetched && <div style={{ color: C.greenDim, fontSize: 12 }}>Loading token meter…</div>}
      {fetched && models.length === 0 && <div style={{ color: C.greenDim, fontSize: 12 }}>No model data yet — seed ./claude-token-meter.json.</div>}
      {models.length > 0 && (
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 720 }}>
            <thead><tr>
              <th style={thL}>Model</th><th style={thL}>Surface</th>
              <th style={th}>Requests</th><th style={th}>In tok</th><th style={th}>Out tok</th>
              <th style={th}>Cost</th><th style={th}>Quality</th><th style={th}>Grade</th>
            </tr></thead>
            <tbody>
              {models.map(function (m, i) { return (
                <tr key={i}>
                  <td style={tdL}>{m.model}</td>
                  <td style={tdL}>{m.surface || m.provider}</td>
                  <td style={td}>{fmt(m.requests != null ? m.requests : m.runs)}</td>
                  <td style={td}>{fmt(m.in_tokens)}</td>
                  <td style={td}>{fmt(m.out_tokens)}</td>
                  <td style={td}>{fmtCost(m.cost_usd)}</td>
                  <td style={td}>{m.quality == null ? '—' : m.quality}</td>
                  <td style={{ ...td, color: gradeColor(m.grade), fontWeight: 700 }}>{m.grade == null ? '—' : m.grade}</td>
                </tr>
              ); })}
            </tbody>
          </table>
        </div>
      )}
      <div style={{ fontSize: 8, color: C.greenDim, marginTop: 10, lineHeight: 1.5, borderTop: `1px solid ${C.greenDim}`, paddingTop: 8 }}>

    </div>
  );

// AAIR helper: Wilson 95% CI for a proportion. A score without an interval is a claim.
// ═══════════════════════════════════════════════════════════════
const wilsonCI = (k, n, digits) => {
  const d = digits == null ? 1 : digits;
  if (!n) return { low: null, high: null };
  const p = k / n;
  const z = 1.96;
  const denom = 1 + (z * z) / n;
  const center = (p + (z * z) / (2 * n)) / denom;
  const margin = (z * Math.sqrt((p * (1 - p) + (z * z) / (4 * n)) / n)) / denom;
  const fmt = (x) => (Math.max(0, Math.min(1, x)) * 100).toFixed(d);
  return { low: fmt(center - margin), high: fmt(center + margin) };
};

const fmtCI = (ci) => (ci && ci.low != null ? ci.low + '%–' + ci.high + '%' : '—');

    const ci = r ? { low: r.ci_lo.toFixed(1), high: r.ci_hi.toFixed(1) } : null;
    return (
      <div style={{ border: '1px solid ' + (r && r.pct_top3 === 100 ? C.green : r && r.pct_top3 === 0 ? '#FF4D4F' : C.cyan), padding: 12, background: 'rgba(0,0,0,0.2)' }}>
        <div style={{ fontSize: 10, color: C.cyan, fontWeight: 700, marginBottom: 6 }}>{label}</div>
        <div style={{ fontSize: 28, fontWeight: 900, color: color(r && r.pct_top3), fontFamily: 'Georgia, serif', lineHeight: 1 }}>{r ? r.pct_top3 : '—'}</div>
        <div style={{ fontSize: 9, color: C.cyan }}>{r && r.fraction_top3} top-3 · CI {fmtCI(ci)}</div>
        <div style={{ fontSize: 8, color: C.greenDim, marginTop: 4 }}>attempted {r && r.attempted} · scored {r && r.scored} · no-read {r && r.no_read}</div>
      </div>
    );
  };

  const engines = corpus ? Object.entries(corpus.engines || {}).sort(([, a], [, b]) => {
    const o = { retrieval: 0, parametric: 1, ondevice: 2 };
    if (o[a.tier] !== o[b.tier]) return o[a.tier] - o[b.tier];
    return a.label.localeCompare(b.label);
  }) : [];

  return (
    <div style={{ margin: '20px 28px', padding: 18, border: '2px dashed ' + C.cyan, background: 'rgba(0,212,255,0.06)', position: 'relative' }}>

      {!loaded && <div style={{ color: C.greenDim, fontSize: 12 }}>Loading v6 data…</div>}

      {loaded && !corpus && (
        <div style={{ color: '#FFAA33', fontSize: 11, marginBottom: 10 }}>Market corpus scan is still running or failed. Results will appear here once frozen.</div>
      )}

      {loaded && corpus && (
        <div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 14, marginBottom: 14 }}>
            <div style={{ border: '1px solid ' + color(corpus.headline && corpus.headline.aair_retrieval_top3), padding: 12, background: 'rgba(0,0,0,0.25)' }}>
              <div style={{ fontSize: 9, color: C.cyan, letterSpacing: 2, marginBottom: 6 }}>HEADLINE · RETRIEVAL TOP-3</div>
              <div style={{ fontSize: 42, fontWeight: 900, color: color(corpus.headline && corpus.headline.aair_retrieval_top3), fontFamily: 'Georgia, serif', lineHeight: 1 }}>{corpus.headline ? corpus.headline.aair_retrieval_top3 : '—'}</div>
              <div style={{ fontSize: 10, color: C.cyan, marginTop: 4 }}>{corpus.headline && corpus.headline.fraction} · 95% CI {corpus.headline && corpus.headline.ci_95}</div>
              <div style={{ fontSize: 8, color: C.greenDim, marginTop: 4 }}>{corpus.headline && corpus.headline.note}</div>
            </div>
            <TierCard tier='retrieval' data={corpus.tiers && corpus.tiers.retrieval} />
            <TierCard tier='parametric' data={corpus.tiers && corpus.tiers.parametric} />
            <TierCard tier='ondevice' data={corpus.tiers && corpus.tiers.ondevice} />
          </div>

          {corpusProv && (
            <div style={{ border: '1px solid ' + C.greenDim, padding: 10, background: 'rgba(0,0,0,0.2)', marginBottom: 14 }}>
              <div style={{ fontSize: 9, color: C.greenDim, letterSpacing: 1.5, marginBottom: 4 }}>CORPUS PROVENANCE</div>
              <div style={{ fontSize: 10, color: C.white, lineHeight: 1.45 }}>
                <span style={{ color: C.cyan }}>{corpusProv.corpus_version}</span> · seed {corpusProv.seed} · {corpusProv.n_prompts} prompts · {corpusProv['cells_per_scan_retrieval_tier']} retrieval cells · {corpusProv.built}
              </div>
              <div style={{ fontSize: 8, color: C.greenDim, lineHeight: 1.35, marginTop: 3 }}>Market-derived / client-blind. {corpusProv.provenance}</div>
            </div>
          )}

          <div style={{ border: '1px solid ' + C.greenDim, padding: 12, background: 'rgba(0,0,0,0.2)', marginBottom: 14 }}>
            <div style={{ fontSize: 10, color: C.cyan, letterSpacing: 1.5, marginBottom: 8 }}>THE TWO-CLOCK MODEL · Same instrument, same hour, two queries</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 12 }}>
              <QueryCard label='Query: "homebuilder signage"' baseline={hb} />
              <QueryCard label='Query: "sign shop"' baseline={ss} />
            </div>
            <div style={{ fontSize: 9, color: C.greenDim, lineHeight: 1.45, marginTop: 8 }}>
              AI visibility is not a scalar. It is a <span style={{ color: C.white }}>business × query × surface</span> tuple. B9 is present when buyers search "homebuilder signage" and absent when they search "sign shop". The corpus replaces both with 100 market-derived prompts so the score is not hostage to one wording.
            </div>
          </div>

          {engines.length > 0 && (
            <div style={{ border: '1px solid ' + C.greenDim, padding: 12, background: 'rgba(0,0,0,0.2)' }}>
              <div style={{ fontSize: 9, color: C.greenDim, letterSpacing: 2, marginBottom: 8 }}>PER-ENGINE CORPUS STATE · top-3/named · CI · no-read</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 8 }}>
                {engines.map(([name, e]) => {
                  const allNoRead = e.scored === 0 && e.no_read > 0;
                  const s = e.scored ? Math.round(100 * e.top3 / e.scored) : null;
                  const ci = wilsonCI(e.top3, e.scored);
                  return (
                    <div key={name} style={{ border: '1px solid rgba(57,255,20,0.2)', padding: 8, background: 'rgba(0,0,0,0.25)' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                        <span style={{ fontSize: 10, color: tierColor[e.tier] || C.white, fontWeight: 700 }}>{e.label}</span>
                        <span style={{ fontSize: 10, fontWeight: 800, color: allNoRead ? '#FF4D4F' : color(s) }}>{allNoRead ? 'NO READ' : s + '%'}</span>
                      </div>
                      <div style={{ fontSize: 8, color: C.greenDim, marginTop: 3 }}>{e.top3}/{e.scored} top3 · {e.named}/{e.scored} named · CI {fmtCI(ci)} · {e.no_read > 0 ? <span style={{ color: '#FFAA33' }}>{e.no_read} no-read</span> : '0 no-read'}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}

      <div style={{ fontSize: 8, color: C.greenDim, marginTop: 12, lineHeight: 1.5, borderTop: '1px solid ' + C.greenDim, paddingTop: 8 }}>
        v5 remains frozen and live at /aair-checker.php for Day-7/Day-14 continuity. v6 measures retrieval (what customers see), parametric (training-data), and on-device (local SLM) as separate clocks. All intervals are Wilson 95% CIs. <span style={{ color: C.cyan }}>B9_AAIR_lift_tracker.md</span>.
      </div>
    </div>
  );
};

// ALL MODELS WE READ — Mirror + SLM + On-device roster
// Reads from ./slm-mirror.json and (optionally) mirrors a provided
// per-client JSON. No hard-coded model names, counts, or captions.
// Harness × Tier grouping. Rendered identically for B9 and PRAGMA.
// ═══════════════════════════════════════════════════════════════
const ModelRosterPanel = ({ client, title, subtitle }) => {
  const [data, setData] = React.useState(null);
  const [fetched, setFetched] = React.useState(false);
  React.useEffect(() => {
    const tryFetch = async () => {
      const rel = client === 'pragma' ? './clients/pragma/brand-insights/slm-mirror.json' : './slm-mirror.json';
      const urls = [
        rel + '?cb=' + Date.now(),
        'https://extracoffee13.github.io/hartley-command/' + rel.replace(/^\.\//, '') + '?cb=' + Date.now(),
      ];
      for (const u of urls) {
        try { const r = await fetch(u, { cache: 'no-store' }); if (r.ok) { const j = await r.json(); setData(j); setFetched(true); return; } } catch (e) {}
      }
      setFetched(true);
    };
    tryFetch();
  }, [client]);

  const scoreColor = (v) => {
    if (v === null || v === undefined) return C.greenDim;
    if (v === 0) return C.greenDim;
    if (v < 33) return C.orange;
    if (v < 66) return C.gold;
    return C.green;
  };

  const mirror = (data && data.mirror_llms) || [];
  const slm = (data && data.slm_models) || [];
  const proxy = (data && data.on_device_proxy) || [];
  const generated = data && data.generated;

  // Tier strictly by roster arrays in slm-mirror.json, not by harness alone.
  // mirror_llms spans consumer surfaces + OpenRouter cloud; slm_models are the 6 SLMs.
  const consumerMirror = mirror.filter(m => (m.harness || '') === 'consumer surface');
  const openRouterMirror = mirror.filter(m => (m.harness || '').indexOf('OpenRouter') >= 0);

  const formatShortId = (id) => {
    if (!id) return '—';
    return id.split('/').pop();
  };

  const tile = (m, i, groupLen) => {
    const allNoRead = m.attempted != null && m.scored === 0 && m.no_read > 0;
    return (
    <div key={i} style={{ border: '1px solid rgba(180,130,255,0.25)', padding: 8, background: 'rgba(0,0,0,0.25)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 3 }}>
        <span style={{ fontSize: 9, color: '#b388ff', fontWeight: 700 }}>{m.kind === 'proxy' ? m.name : formatShortId(m.model)}</span>
        {allNoRead
          ? <span style={{ fontSize: 9, fontWeight: 700, color: '#FF4D4F' }}>NO READ</span>
          : <span style={{ fontSize: 9, fontWeight: 700, color: scoreColor(m.score) }}>{m.score === undefined || m.score === null ? '—' : m.score + '%'}</span>}
      </div>
      <div style={{ fontSize: 7.5, color: C.cyan, marginBottom: 3, lineHeight: 1.3 }}>{m.harness}</div>
      {m.model && <div style={{ fontSize: 7.5, color: C.greenDim, marginBottom: 3 }}>{m.model}</div>}
      <div style={{ fontSize: 7, color: 'rgba(255,255,255,0.35)', lineHeight: 1.4 }}>
        {m.attempted != null ? (m.scored + '/' + m.attempted + ' scored' + (m.no_read > 0 ? ' · ' + m.no_read + ' no-read' : '')) : ''}
        {m.attempted != null && (m.temp !== undefined || m.max_tokens !== undefined || m.checked_at) ? ' · ' : ''}
        {m.temp !== undefined ? 't=' + m.temp + ' · ' : ''}
        {m.max_tokens !== undefined ? 'max=' + m.max_tokens : ''}
        {m.checked_at ? (' · ' + m.checked_at.slice(0, 19).replace('T', ' ')) : ''}
      </div>
      {m.note && <div style={{ fontSize: 7, color: C.greenDim, marginTop: 4, lineHeight: 1.3 }}>{m.note}</div>}
    </div>
  )};

  const group = (label, tierLabel, models, kind) => (
    models.length > 0 && (
      <div key={label + '-' + tierLabel} style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 9, color: C.cyan, letterSpacing: 2, marginBottom: 6 }}>{label} · {tierLabel} · {models.length} model{models.length === 1 ? '' : 's'}</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))', gap: 8 }}>
          {models.map((m, i) => tile({ ...m, kind }, i, models.length))}
        </div>
      </div>
    )
  );

  const summaryText = () => {
    if (!data) return '';
    return `${consumerMirror.length} consumer surfaces · ${openRouterMirror.length} OpenRouter Mirror LLMs · ${slm.length} OpenRouter SLMs · ${proxy.length} on-device proxies · ${mirror.length + slm.length} probed engines`;
  };

  return (
    <div style={{ background: 'linear-gradient(135deg, rgba(79,0,255,0.06) 0%, rgba(20,0,40,0.6) 100%)', border: '1px solid rgba(180,130,255,0.35)', borderRadius: 4, padding: 24, margin: '16px 0', position: 'relative' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
        <span style={{ color: '#b388ff', fontWeight: 700, fontSize: 15, letterSpacing: 1 }}>◇ {title}</span>
        <span style={{ color: C.greenDim, fontSize: 11 }}>{generated ? generated.slice(0, 19).replace('T', ' ') : (fetched ? 'no data' : 'loading…')}</span>
      </div>
      <div style={{ color: 'rgba(255,255,255,0.45)', fontSize: 11, marginBottom: 14 }}>{subtitle}</div>
      {!fetched && <div style={{ color: C.greenDim, fontSize: 12 }}>Loading model roster…</div>}
      {fetched && !data && <div style={{ color: C.greenDim, fontSize: 12 }}>Model roster not yet published — run slm_mirror.py.</div>}

      {data && (
        <div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 16, marginBottom: 16 }}>
            <div>
              <div style={{ fontSize: 9, color: C.greenDim, letterSpacing: 2, marginBottom: 2 }}>OPENROUTER SCANNED</div>
              <div style={{ fontSize: 48, fontWeight: 900, color: '#b388ff', fontFamily: 'Georgia, serif', lineHeight: 1 }}>{mirror.length + slm.length}</div>
            </div>
            <div style={{ fontSize: 9, color: C.greenDim, lineHeight: 1.5, maxWidth: 520 }}>
              {summaryText()}
            </div>
          </div>
          <div style={{ fontSize: 9, color: '#FFAA33', marginBottom: 12 }}>
            {data.no_read != null || data.slm_total_no_read != null
              ? ("Valid scan: " + (data.scored != null ? data.scored : data.slm_total_scored) + "/" + (data.attempted != null ? data.attempted : data.slm_total_attempted) + " scored · " + (data.no_read != null ? data.no_read : data.slm_total_no_read) + " no-read")
              : null}
          </div>

          {group('CONSUMER SURFACE', 'Mirror LLM', consumerMirror, 'mirror')}
          {group('OPENROUTER', 'Mirror LLM', openRouterMirror, 'mirror')}
          {group('OPENROUTER', 'SLM', slm, 'slm')}
          {group('OLLAMA', 'ON-DEVICE PROXY', proxy.map(m => ({ name: m.name, note: m.note, harness: 'Ollama · on-device proxy', checked_at: generated })), 'proxy')}
        </div>
      )}

      <div style={{ color: 'rgba(255,255,255,0.35)', fontSize: 10, marginTop: 10 }}>
        Data source: {client === 'pragma' ? './clients/pragma/brand-insights/slm-mirror.json' : './slm-mirror.json'} — rendered from roster arrays (mirror_llms / slm_models), never hard-coded.
      </div>
    </div>
  );
};

// KANBAN STRIP — live Hermes kanban board state (2026-06-03)
// Reads /kanban-state.json (written by kanban_bridge.py via inbox-poller hook)
const KanbanStrip = () => {
  const [data, setData] = React.useState(null);
  const [err, setErr] = React.useState(null);
  React.useEffect(() => {
    fetch('./kanban-state.json?cb=' + Date.now())
      .then(r => r.ok ? r.json() : Promise.reject('http ' + r.status))
      .then(d => setData(d))
      .catch(e => setErr(String(e)));
    const t = setInterval(() => {
      fetch('./kanban-state.json?cb=' + Date.now())
        .then(r => r.ok ? r.json() : null).then(d => d && setData(d)).catch(()=>{});
    }, 60000);
    return () => clearInterval(t);
  }, []);

  const lanes = [
    { key: 'inbox', label: 'INBOX', color: C.greenDim },
    { key: 'in_flight', label: 'IN-FLIGHT', color: C.cyan },
    { key: 'blocked', label: 'BLOCKED', color: C.red },
    { key: 'done', label: 'DONE', color: C.green },
  ];
  const counts = data?.counts || {};
  const total = Object.values(counts).reduce((a,b) => a+b, 0);
  const freshness = data?.generated_at ? new Date(data.generated_at) : null;
  const ageMin = freshness ? Math.round((Date.now() - freshness.getTime()) / 60000) : null;
  const fresh = ageMin !== null && ageMin < 10;
  // ET-localized display per locked Eastern-Time-everywhere rule
  const etTime = freshness ? freshness.toLocaleString("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false }) : null;

  return (
    <div style={{ margin: "20px 28px", border: `2px solid ${C.cyan}`, padding: 16, background: "rgba(0,212,255,0.04)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
        <div>
          <div style={{ fontSize: 10, color: C.cyan, letterSpacing: 4 }}>⌬ KANBAN · Hermes-Agent native · 2026-06-03</div>
          <div style={{ fontSize: 14, color: C.cyan, fontWeight: 700, marginTop: 4 }}>
            Inbox → In-Flight → Blocked / Done · {total} cards total
          </div>
        </div>
        <div style={{ fontSize: 9, color: fresh ? C.green : C.orange, letterSpacing: 1 }}>
          {err ? `STATE FILE MISSING — ${err}` : (
            ageMin === null ? "loading…" :
            fresh ? `🟢 LIVE · ${etTime} ET · refreshed ${ageMin}m ago` :
                    `🟠 SNAPSHOT · ${etTime} ET · ${ageMin}m old`
          )}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12 }}>
        {lanes.map(L => {
          const cards = (data?.lanes?.[L.key] || []).slice(0, 8);
          return (
            <div key={L.key} style={{ border: `1px solid ${L.color}`, padding: 10, background: "rgba(0,0,0,0.3)" }}>
              <div style={{ fontSize: 10, color: L.color, letterSpacing: 3, marginBottom: 8, display: "flex", justifyContent: "space-between" }}>
                <span>{L.label}</span>
                <span style={{ fontWeight: 700 }}>{counts[L.key] ?? 0}</span>
              </div>
              {cards.length === 0 && <div style={{ fontSize: 9, color: C.greenDim, opacity: 0.5 }}>—</div>}
              {cards.map(c => (
                <div key={c.task_id} style={{ fontSize: 9, color: C.greenDim, lineHeight: 1.4, marginBottom: 6, opacity: 0.85 }}>
                  <div style={{ color: L.color, fontWeight: 500 }}>{c.task_id.split('-')[0]}</div>
                  <div>{(c.title || c.task_id).slice(0, 60)}</div>
                </div>
              ))}
              {counts[L.key] > 8 && (
                <div style={{ fontSize: 8, color: L.color, opacity: 0.6, marginTop: 4 }}>+{counts[L.key] - 8} more</div>
              )}
            </div>
          );
        })}
      </div>
      <div style={{ fontSize: 8, color: C.cyan, opacity: 0.55, marginTop: 10, letterSpacing: 1 }}>
        Source: ~/.hermes/kanban.db (SQLite) · Bridge: /Atlas/hermes-sandbox/lib/kanban_bridge.py · Refresh: every 60s
      </div>
    </div>
  );
};

<!-- Live-data hydration · reads hermes-status.json (written hourly by hermes-status-writer Call).
     Failed fetch leaves static fallback values in place — dashboard stays usable offline. -->
<script>
(function hydrateLive() {
  function update(key, val) {
    document.querySelectorAll('[data-live="' + key + '"]').forEach(el => {
      if (val === null || val === undefined || val === '') return;
      if (key === 'subagents_html') {
        el.innerHTML = String(val);
      } else {
        el.textContent = String(val);
      }
    });
  }
  const sources = [
    './hermes-status.json',
    'https://extracoffee13.github.io/hartley-command/hermes-status.json'
  ];
  // Harvard Corpus hydration — separate JSON
  (async () => {
    try {
      const r = await fetch('./harvard-corpus-stats.json?nocache=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) {
        const r2 = await fetch('https://extracoffee13.github.io/hartley-command/harvard-corpus-stats.json?nocache=' + Date.now(), { cache: 'no-store' });
        if (!r2.ok) return;
        const hc = await r2.json();
        update('hc_total', hc.total_articles);
        update('hc_faculty', hc.faculty_indexed);
        update('hc_topics', hc.topics_covered);
        update('hc_faclinks', (hc.total_faculty_links || 0).toLocaleString());
        update('hc_topiclinks', (hc.total_topic_links || 0).toLocaleString());
        update('hc_hbswk', hc.by_source && hc.by_source.hbswk);
        update('hc_hbsai', hc.by_source && hc.by_source['hbs-ai-institute']);
        update('hc_d3_total', hc.by_source && hc.by_source.d3);
        return;
      }
      const hc = await r.json();
      update('hc_total', hc.total_articles);
      update('hc_faculty', hc.faculty_indexed);
      update('hc_topics', hc.topics_covered);
      update('hc_faclinks', (hc.total_faculty_links || 0).toLocaleString());
      update('hc_topiclinks', (hc.total_topic_links || 0).toLocaleString());
      update('hc_hbswk', hc.by_source && hc.by_source.hbswk);
      update('hc_hbsai', hc.by_source && hc.by_source['hbs-ai-institute']);
      update('hc_d3_total', hc.by_source && hc.by_source.d3);
    } catch (e) { /* fallback to static */ }
  })();

  // Flock classification hydration — flock-classification.json (added 2026-06-05 PM)
  // Replaces hardcoded "13 wild ducks · 33 calls" with live count from classifier output.
  (async () => {
    const urls = [
      './flock-classification.json?cb=' + Date.now(),
      'https://extracoffee13.github.io/hartley-command/flock-classification.json?cb=' + Date.now(),
    ];
    let fc = null;
    for (const u of urls) {
      try { const r = await fetch(u, {cache:'no-store'}); if (r.ok) { fc = await r.json(); break; } } catch(_){}
    }
    if (!fc) return;
    const wd = (fc.wild_ducks && fc.wild_ducks.count) || 0;
    const ca = (fc.calls && fc.calls.count) || 0;
    update('hermes-flock-summary', `hermes-agent v0.18.0 · substrate · ${wd} wild ducks · ${ca} calls`);
    update('wild_ducks_count', wd);
    update('calls_count', ca);
  })();

  // Skills Registry hydration — daily-scanner output (added 2026-06-05)
  // Reads installed-skills-registry.json + compares to hardcoded INTERNAL_AGENTS cards
  (async () => {
    const urls = [
      './installed-skills-registry.json?cb=' + Date.now(),
      'https://extracoffee13.github.io/hartley-command/installed-skills-registry.json?cb=' + Date.now(),
    ];
    let reg = null;
    for (const u of urls) {
      try { const r = await fetch(u, {cache: 'no-store'}); if (r.ok) { reg = await r.json(); break; } } catch(_) {}
    }
    if (!reg) {
      update('skills_registry_total', 'registry not yet mirrored');
      update('skills_registry_ts', 'pending first sync');
      update('skills_registry_new_count', '?');
      update('skills_registry_new_list', '(brand-insights-mirror Call needs to fire once to publish the registry)');
      return;
    }
    const skills = reg.skills || [];
    update('skills_registry_total', skills.length);
    update('skills_registry_ts', (reg.updated_at || reg._mirrored_at || '?').slice(0,19) + 'Z');
    // Find skills in registry NOT in INTERNAL_AGENTS hardcoded ids
    let hardcoded = new Set();
    try {
      document.querySelectorAll('[data-internal-id]').forEach(el => hardcoded.add(el.getAttribute('data-internal-id')));
    } catch(_) {}
    // Fallback if no data-internal-id — derive from INTERNAL_AGENTS global if exposed
    const hardcodedNames = new Set([
      'graphify','taste-skill','notfair','pro-workflow','memsearch','design-extract',
      'claude-codex-settings','claude-mem','harness','awesome-claude-plugins',
      'antigravity-skills','claude-octopus','nesquena-hermes-webui','allin','anthropic',
      'gv','jobs','hormozi','musk','nvidia','oleary','leo','harvard-library',
      'harvard-quotables','hbs-ai-institute','hbs-courses','frontier-firm-framework',
    ]);
    const newOnes = skills.filter(s => {
      const nm = (s.name || s.slug || s.id || '').toLowerCase();
      return nm && !hardcodedNames.has(nm);
    });
    update('skills_registry_new_count', newOnes.length);
    update('skills_registry_new_list',
      newOnes.length === 0 ? 'all registry skills represented in Internal cards · no new discoveries today' :
      newOnes.map(s => '· ' + (s.name || s.slug || s.id || '?')).join('  '));
  })();

  (async () => {
    for (const url of sources) {
      try {
        const res = await fetch(url + '?nocache=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) continue;
        const d = await res.json();
        // Flock counts are authoritative from flock-classification.json — skip them here
        const skipKeys = new Set(['wild_ducks_count', 'calls_count']);
        Object.entries(d).forEach(([k, v]) => { if (!skipKeys.has(k)) update(k, v); });
        // Stamp the source URL so we can see it worked
        const stamp = document.createElement('div');
        stamp.style.cssText = 'position:fixed;bottom:6px;right:8px;font-size:8px;color:#39ff14;opacity:0.4;font-family:monospace;letter-spacing:1px';
        stamp.textContent = 'live · ' + new Date(d.heartbeat_ts || d.last_write || Date.now()).toLocaleTimeString();
        document.body.appendChild(stamp);
        return;
      } catch (e) { /* try next source */ }
    }
  })();
  // Re-hydrate after React mounts (give it 600ms)
  setTimeout(hydrateLive, 600);
})();
</script>

<script>
/* ===== CONSTRUCT LIVE-UPDATES + PER-FEED FRESHNESS (2026-06-18) =====
   Ends the recurring "dashboard reads the same as yesterday" problem: every feed
   shows its own timestamp + a red STALE badge when old, so missing/old data is
   VISIBLE and attributable — never silently reassuring. Runs outside React. */
(function(){
  var O=document.getElementById('construct-updates-overlay'); if(!O) return;
  var MUT='#8a94a6',RED='#f87171',GRN='#4ade80',AMB='#fbbf24',CY='#00d4ff';
  function ageH(ts){ if(!ts) return null; var t=new Date(ts); if(isNaN(t)) return null; return (Date.now()-t)/36e5; }
  function badge(ts,maxH){ var a=ageH(ts); if(a==null) return '<span style="color:'+RED+'">⚠ no timestamp</span>';
    var lbl=a<1?Math.round(a*60)+'m':(a<48?a.toFixed(1)+'h':Math.round(a/24)+'d')+' ago';
    var stale=a>maxH; return '<span style="color:'+(stale?RED:GRN)+'">'+(stale?'⚠ STALE ':'● ')+lbl+'</span>'; }
  function gj(u){ return fetch(u+'?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}); }

  function render(corpus,scout,cites,wolf){
    var rows=[];
    // Harvard corpus
    rows.push(['Harvard corpus', corpus?(corpus.total_articles+' articles'):'—', corpus&&corpus.last_indexed, 30]);
    // Capability scout
    var sc = scout&&(scout.candidates||scout); var scn = Array.isArray(sc)?sc.length:0;
    rows.push(['Capability scout', scn?scn+' candidates':'—', scout&&(scout.generated||scout.updated_at), 30]);
    // Citations (per client, browserless probe)
    if(cites){ Object.keys(cites).forEach(function(c){ var x=cites[c]||{};
      rows.push(['Citations · '+c, (x.cited_any?Object.keys(x.cited_any).filter(function(k){return x.cited_any[k];}).join(',')||'none cited':'—'), x.ran_at, 30]); }); }
    // WOLF
    var thesesHtml='';
    if(wolf && wolf.research_theses && wolf.research_theses.length){
      thesesHtml='<div style="margin-top:10px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:'+MUT+'">Deep Research Theses</div>'+
        wolf.research_theses.map(function(t){
          var v=t.verdict||'UNKNOWN', vc=v==='BULLISH'?GRN:(v==='BEARISH'?RED:AMB);
          return '<div style="margin:6px 0;padding:6px 8px;background:#151a21;border-left:2px solid '+vc+';border-radius:0 4px 4px 0;">'+
            '<span style="font-weight:700;">'+(t.ticker||'?')+'</span> '+
            '<span style="color:'+vc+';font-weight:700;">'+v+'</span>'+
            '<div style="color:rgba(255,255,255,0.7);font-size:11px;margin-top:2px;">'+((t.one_line||'').replace(/\*/g,''))+'</div>'+
            '<div style="color:#6b7280;font-size:10px;margin-top:2px;">'+(t.generated||'').slice(0,10)+' · '+(t.source||'?')+'</div>'+
            '</div>';
        }).join('')+'</div>';
    }
    rows.push(['WOLF', wolf?((wolf.market_regime&&wolf.market_regime.current||'?')+' · '+(wolf.account&&'$'+Math.round(wolf.account.equity).toLocaleString())):'—', wolf&&wolf.last_updated, 12, thesesHtml]);

    var anyStale=rows.some(function(r){var a=ageH(r[2]); return a==null||a>r[3];});
    var html='<div style="background:#0f1217;border:1px solid '+(anyStale?RED:GRN)+';border-radius:10px;padding:12px 14px;">'+
      '<div style="font-size:12px;font-weight:700;letter-spacing:.04em;color:'+(anyStale?RED:GRN)+';margin-bottom:8px;">'+
        (anyStale?'⚠ CONSTRUCT — some feeds STALE (see flags)':'● CONSTRUCT — all feeds current')+
        '<span style="float:right;color:'+MUT+';font-weight:400;">live · refreshes 60s · '+new Date().toLocaleTimeString()+'</span></div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;">';
    rows.forEach(function(r){ html+='<div style="background:#151a21;border:1px solid #1f2630;border-radius:8px;padding:8px 10px;">'+
