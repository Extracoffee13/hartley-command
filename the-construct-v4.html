// ─── Matrix rain background (preserved from v2.3) ────────────────
const MatrixRain = () => {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let animId;
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener("resize", resize);
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF:.";
    const draw = () => {
      ctx.fillStyle = "rgba(0,0,0,0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${fontSize}px monospace`;
      columns = Math.floor(canvas.width / fontSize);
      while (drops.length < columns) drops.push(1);
      for (let i = 0; i < columns; i++) {
        const ch = chars[Math.floor(Math.random() * chars.length)];
        const b = Math.random();
        if (b > 0.95) ctx.fillStyle = "#ffffff";
        else if (b > 0.85) ctx.fillStyle = "#39ff14";
        else ctx.fillStyle = `rgba(0, ${100 + Math.floor(Math.random()*155)}, 0, ${0.25 + Math.random()*0.4})`;
        ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      animId = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(animId); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", inset: 0, zIndex: 0, opacity: 0.10, pointerEvents: "none" }} />;
};

const ClaudeTokenMeterPanel = () => {
  const [data, setData] = React.useState(null);

  React.useEffect(() => {
    (async () => {

        './claude-token-meter.json?cb=' + Date.now(),

  const gradeColor = (g) => g == null ? C.greenDim : (String(g).startsWith('A') ? C.green : String(g).startsWith('B') ? C.cyan : String(g).startsWith('C') ? C.gold : C.red);

  const tdL = { ...td, textAlign: 'left' };

        </div>
        <div style={{ textAlign: 'right' }}>
          <div style={{ fontSize: 9, color: C.greenDim, letterSpacing: 2 }}>WEEKLY LIMIT USED</div>
          <div style={{ fontSize: 36, fontWeight: 900, color: pctColor, fontFamily: 'monospace' }}>{pct == null ? '--' : pct + '%'}</div>
        </div>
      </div>

      <div style={{ height: 12, background: 'rgba(255,255,255,0.08)', borderRadius: 6, overflow: 'hidden', marginBottom: 4 }}>
        <div style={{ width: (pct == null ? 0 : Math.min(pct, 100)) + '%', height: '100%', background: pctColor, transition: 'width .4s' }} />
      </div>
      <div style={{ fontSize: 8, color: C.greenDim, marginBottom: 14 }}>{wl.note || ''}</div>

      <div style={{ fontSize: 9, color: C.gold, letterSpacing: 2, marginBottom: 6 }}>MODELS IN USE — TOKENS · COST · GRADE</div>
      {!fetched && <div style={{ color: C.greenDim, fontSize: 12 }}>Loading token meter…</div>}
      {fetched && models.length === 0 && <div style={{ color: C.greenDim, fontSize: 12 }}>No model data yet — seed ./claude-token-meter.json.</div>}
      {models.length > 0 && (
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 720 }}>
            <thead><tr>
              <th style={thL}>Model</th><th style={thL}>Surface</th>

                <tr key={i}>

                  <td style={td}>{fmt(m.requests != null ? m.requests : m.runs)}</td>
                  <td style={td}>{fmt(m.in_tokens)}</td>
                  <td style={td}>{fmt(m.out_tokens)}</td>
                  <td style={td}>{fmtCost(m.cost_usd)}</td>

                  <td style={{ ...td, color: gradeColor(m.grade), fontWeight: 700 }}>{m.grade == null ? '—' : m.grade}</td>
                </tr>
              ); })}
            </tbody>
          </table>
        </div>

      <div style={{ fontSize: 8, color: C.greenDim, marginTop: 10, lineHeight: 1.5, borderTop: `1px solid ${C.greenDim}`, paddingTop: 8 }}>

<!-- Live-data hydration · reads hermes-status.json (written hourly by hermes-status-writer Call).
     Failed fetch leaves static fallback values in place — dashboard stays usable offline. -->
<script>
(function hydrateLive() {
  function update(key, val) {
    document.querySelectorAll('[data-live="' + key + '"]').forEach(el => {
      if (val === null || val === undefined || val === '') return;
      if (key === 'subagents_html') {
        el.innerHTML = String(val);
      } else {
        el.textContent = String(val);
      }
    });
  }
  const sources = [
    './hermes-status.json',
    'https://extracoffee13.github.io/hartley-command/hermes-status.json'
  ];
  // Harvard Corpus hydration — separate JSON
  (async () => {
    try {
      const r = await fetch('./harvard-corpus-stats.json?nocache=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) {
        const r2 = await fetch('https://extracoffee13.github.io/hartley-command/harvard-corpus-stats.json?nocache=' + Date.now(), { cache: 'no-store' });
        if (!r2.ok) return;
        const hc = await r2.json();
        update('hc_total', hc.total_articles);
        update('hc_faculty', hc.faculty_indexed);
        update('hc_topics', hc.topics_covered);
        update('hc_faclinks', (hc.total_faculty_links || 0).toLocaleString());
        update('hc_topiclinks', (hc.total_topic_links || 0).toLocaleString());
        update('hc_hbswk', hc.by_source && hc.by_source.hbswk);
        return;
      }
      const hc = await r.json();
      update('hc_total', hc.total_articles);
      update('hc_faculty', hc.faculty_indexed);
      update('hc_topics', hc.topics_covered);
      update('hc_faclinks', (hc.total_faculty_links || 0).toLocaleString());
      update('hc_topiclinks', (hc.total_topic_links || 0).toLocaleString());
      update('hc_hbswk', hc.by_source && hc.by_source.hbswk);
    } catch (e) { /* fallback to static */ }
  })();

  // Flock classification hydration — flock-classification.json (added 2026-06-05 PM)
  // Replaces hardcoded "13 wild ducks · 33 calls" with live count from classifier output.
  (async () => {
    const urls = [
      './flock-classification.json?cb=' + Date.now(),
      'https://extracoffee13.github.io/hartley-command/flock-classification.json?cb=' + Date.now(),
    ];
    let fc = null;
    for (const u of urls) {
      try { const r = await fetch(u, {cache:'no-store'}); if (r.ok) { fc = await r.json(); break; } } catch(_){}
    }
    if (!fc) return;
    const wd = (fc.wild_ducks && fc.wild_ducks.count) || 0;
    const ca = (fc.calls && fc.calls.count) || 0;
    update('hermes-flock-summary', `hermes-agent v0.18.0 · substrate · ${wd} wild ducks · ${ca} calls`);
    update('wild_ducks_count', wd);
    update('calls_count', ca);
  })();

  // Skills Registry hydration — daily-scanner output (added 2026-06-05)
  // Reads installed-skills-registry.json + compares to hardcoded INTERNAL_AGENTS cards
  (async () => {
    const urls = [
      './installed-skills-registry.json?cb=' + Date.now(),
      'https://extracoffee13.github.io/hartley-command/installed-skills-registry.json?cb=' + Date.now(),
    ];
    let reg = null;
    for (const u of urls) {
      try { const r = await fetch(u, {cache: 'no-store'}); if (r.ok) { reg = await r.json(); break; } } catch(_) {}
    }
    if (!reg) {
      update('skills_registry_total', 'registry not yet mirrored');
      update('skills_registry_ts', 'pending first sync');
      update('skills_registry_new_count', '?');
      update('skills_registry_new_list', '(brand-insights-mirror Call needs to fire once to publish the registry)');
      return;
    }
    const skills = reg.skills || [];
    update('skills_registry_total', skills.length);
    update('skills_registry_ts', (reg.updated_at || reg._mirrored_at || '?').slice(0,19) + 'Z');
    // Find skills in registry NOT in INTERNAL_AGENTS hardcoded ids
    let hardcoded = new Set();
    try {
      document.querySelectorAll('[data-internal-id]').forEach(el => hardcoded.add(el.getAttribute('data-internal-id')));
    } catch(_) {}
    // Fallback if no data-internal-id — derive from INTERNAL_AGENTS global if exposed
    const hardcodedNames = new Set([
      'graphify','taste-skill','notfair','pro-workflow','memsearch','design-extract',
      'claude-codex-settings','claude-mem','harness','awesome-claude-plugins',
      'antigravity-skills','claude-octopus','nesquena-hermes-webui','allin','anthropic',
      'gv','jobs','hormozi','musk','nvidia','oleary','leo','harvard-library',
      'harvard-quotables','hbs-ai-institute','hbs-courses','frontier-firm-framework',
    ]);
    const newOnes = skills.filter(s => {
      const nm = (s.name || s.slug || s.id || '').toLowerCase();
      return nm && !hardcodedNames.has(nm);
    });
    update('skills_registry_new_count', newOnes.length);
    update('skills_registry_new_list',
      newOnes.length === 0 ? 'all registry skills represented in Internal cards · no new discoveries today' :
      newOnes.map(s => '· ' + (s.name || s.slug || s.id || '?')).join('  '));
  })();

  (async () => {
    for (const url of sources) {
      try {
        const res = await fetch(url + '?nocache=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) continue;
        const d = await res.json();
        // Flock counts are authoritative from flock-classification.json — skip them here
        const skipKeys = new Set(['wild_ducks_count', 'calls_count']);
        Object.entries(d).forEach(([k, v]) => { if (!skipKeys.has(k)) update(k, v); });
        // Stamp the source URL so we can see it worked
        const stamp = document.createElement('div');
        stamp.style.cssText = 'position:fixed;bottom:6px;right:8px;font-size:8px;color:#39ff14;opacity:0.4;font-family:monospace;letter-spacing:1px';
        stamp.textContent = 'live · ' + new Date(d.heartbeat_ts || d.last_write || Date.now()).toLocaleTimeString();
        document.body.appendChild(stamp);
        return;
      } catch (e) { /* try next source */ }
    }
  })();
  // Re-hydrate after React mounts (give it 600ms)
  setTimeout(hydrateLive, 600);
})();
</script>

<script>
/* ===== CONSTRUCT LIVE-UPDATES + PER-FEED FRESHNESS (2026-06-18) =====
   Ends the recurring "dashboard reads the same as yesterday" problem: every feed
   shows its own timestamp + a red STALE badge when old, so missing/old data is
   VISIBLE and attributable — never silently reassuring. Runs outside React. */
(function(){
  var O=document.getElementById('construct-updates-overlay'); if(!O) return;
  var MUT='#8a94a6',RED='#f87171',GRN='#4ade80',AMB='#fbbf24',CY='#00d4ff';
  function ageH(ts){ if(!ts) return null; var t=new Date(ts); if(isNaN(t)) return null; return (Date.now()-t)/36e5; }
  function badge(ts,maxH){ var a=ageH(ts); if(a==null) return '<span style="color:'+RED+'">⚠ no timestamp</span>';
    var lbl=a<1?Math.round(a*60)+'m':(a<48?a.toFixed(1)+'h':Math.round(a/24)+'d')+' ago';
    var stale=a>maxH; return '<span style="color:'+(stale?RED:GRN)+'">'+(stale?'⚠ STALE ':'● ')+lbl+'</span>'; }
  function gj(u){ return fetch(u+'?cb='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}); }

  function render(corpus,scout,cites,wolf){
    var rows=[];
    // Harvard corpus
    rows.push(['Harvard corpus', corpus?(corpus.total_articles+' articles'):'—', corpus&&corpus.last_indexed, 30]);
    // Capability scout
    var sc = scout&&(scout.candidates||scout); var scn = Array.isArray(sc)?sc.length:0;
    rows.push(['Capability scout', scn?scn+' candidates':'—', scout&&(scout.generated||scout.updated_at), 30]);
    // Citations (per client, browserless probe)
    if(cites){ Object.keys(cites).forEach(function(c){ var x=cites[c]||{};
      rows.push(['Citations · '+c, (x.cited_any?Object.keys(x.cited_any).filter(function(k){return x.cited_any[k];}).join(',')||'none cited':'—'), x.ran_at, 30]); }); }
    // WOLF
    var thesesHtml='';
    if(wolf && wolf.research_theses && wolf.research_theses.length){
      thesesHtml='<div style="margin-top:10px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:'+MUT+'">Deep Research Theses</div>'+
        wolf.research_theses.map(function(t){
          var v=t.verdict||'UNKNOWN', vc=v==='BULLISH'?GRN:(v==='BEARISH'?RED:AMB);
          return '<div style="margin:6px 0;padding:6px 8px;background:#151a21;border-left:2px solid '+vc+';border-radius:0 4px 4px 0;">'+
            '<span style="font-weight:700;">'+(t.ticker||'?')+'</span> '+
            '<span style="color:'+vc+';font-weight:700;">'+v+'</span>'+
            '<div style="color:rgba(255,255,255,0.7);font-size:11px;margin-top:2px;">'+((t.one_line||'').replace(/\*/g,''))+'</div>'+
            '<div style="color:#6b7280;font-size:10px;margin-top:2px;">'+(t.generated||'').slice(0,10)+' · '+(t.source||'?')+'</div>'+
            '</div>';
        }).join('')+'</div>';
    }
    rows.push(['WOLF', wolf?((wolf.market_regime&&wolf.market_regime.current||'?')+' · '+(wolf.account&&'$'+Math.round(wolf.account.equity).toLocaleString())):'—', wolf&&wolf.last_updated, 12, thesesHtml]);

    var anyStale=rows.some(function(r){var a=ageH(r[2]); return a==null||a>r[3];});
    var html='<div style="background:#0f1217;border:1px solid '+(anyStale?RED:GRN)+';border-radius:10px;padding:12px 14px;">'+
      '<div style="font-size:12px;font-weight:700;letter-spacing:.04em;color:'+(anyStale?RED:GRN)+';margin-bottom:8px;">'+
        (anyStale?'⚠ CONSTRUCT — some feeds STALE (see flags)':'● CONSTRUCT — all feeds current')+
        '<span style="float:right;color:'+MUT+';font-weight:400;">live · refreshes 60s · '+new Date().toLocaleTimeString()+'</span></div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;">';
    rows.forEach(function(r){ html+='<div style="background:#151a21;border:1px solid #1f2630;border-radius:8px;padding:8px 10px;">'+
      '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:'+MUT+'">'+r[0]+'</div>'+
      '<div style="font-size:13px;color:#e6e9ef;margin:2px 0;font-family:ui-monospace,Menlo,monospace;">'+r[1]+'</div>'+
      '<div style="font-size:11px;font-family:ui-monospace,Menlo,monospace;">'+badge(r[2],r[3])+'</div>'+
      (r[4]||'')+'</div>'; });
    html+='</div>';
    // Scout top picks
    if(scn){ var top=(Array.isArray(sc)?sc:[]).slice(0,3); html+='<div style="margin-top:8px;font-size:11px;color:'+CY+'">Scout top: '+
      top.map(function(c){return (c.name||c.title||'?')+(c.action&&/APPROVAL/i.test(c.action)?' ⚑needs approval':'');}).join(' · ')+'</div>'; }
    html+='</div>';
    O.innerHTML=html;
  }
  function load(){
    Promise.all([ gj('./harvard-corpus-stats.json'), gj('./capability-scout-queue.json'),
      gj('./citations-summary.json'),
      gj('https://raw.githubusercontent.com/Extracoffee13/hartley-command/main/wolf_live_data.json')
    ]).then(function(a){ render(a[0],a[1],a[2],a[3]); });
  }
  load(); setInterval(load,60000);
})();
</script>
